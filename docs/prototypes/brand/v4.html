<!doctype html>
<!-- Throwaway prototype, round 4: the BPMN ant with heads that read as ant, not bunny. Open in a browser. -->
<meta charset="utf-8">
<title>Brand prototype, round 4</title>
<style>
  :root { --acc: #ff4f1f; --ink: #0e1525 }
  body { font: 15px Inter, system-ui, sans-serif; margin: 0; background: #f6f7f9; color: var(--ink) }
  main { max-width: 1100px; margin: 0 auto; padding: 32px }
  .row { display: grid; grid-template-columns: 180px 200px 230px 230px 96px 40px; gap: 16px; align-items: center; margin-bottom: 20px }
  .about { font-size: 13px; color: #667085; line-height: 1.45 } .about b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px }
  .big svg { width: 200px; height: 110px; display: block }
  .card { border-radius: 14px; padding: 20px 24px; display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 30px; letter-spacing: -.03em }
  .card svg { width: 64px; height: 32px }
  .icon { width: 96px; height: 96px; border-radius: 22px; background: var(--ink); color: #fff; display: grid; place-items: center }
  .icon svg { width: 76px; height: 38px }
  .fav svg { width: 32px; height: 16px }
</style>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- The body, shared by all heads: a Task (thorax) and an end event (abdomen). -->
  <g id="body">
    <path d="M27 24 H33 M47 24 H51" stroke="currentColor" stroke-width="3"/>
    <rect x="33" y="17" width="14" height="14" rx="4" fill="currentColor"/>
    <circle cx="60" cy="24" r="8" fill="none" stroke="currentColor" stroke-width="5"/>
  </g>
  <g id="headRing"><circle cx="20" cy="24" r="7" fill="none" stroke="var(--acc)" stroke-width="3"/></g>
  <!-- Mandibles: two small hooks at the front of the head. -->
  <path id="jaws" d="M14 28 Q8 31 6 26" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 1: elbowed antennae, both bending forward like a walking ant seen from the side. -->
  <symbol id="h1" viewBox="0 0 72 40">
    <use href="#body"/><use href="#headRing"/>
    <path d="M16 18 L13 8 L4 12 M21 17 L20 6 L11 8" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 2: elbowed antennae + jaws. -->
  <symbol id="h2" viewBox="0 0 72 40">
    <use href="#body"/><use href="#headRing"/><use href="#jaws"/>
    <path d="M16 18 L13 8 L4 12 M21 17 L20 6 L11 8" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 3: one antenna, elbowed down at the tip, and jaws. Fewer lines, still an ant. -->
  <symbol id="h3" viewBox="0 0 72 40">
    <use href="#body"/><use href="#headRing"/><use href="#jaws"/>
    <path d="M18 17 L15 6 L5 10" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 4: no antennae: a solid head with jaws, like a pincer at the front of the Process. -->
  <symbol id="h4" viewBox="0 0 72 40">
    <use href="#body"/>
    <circle cx="20" cy="24" r="7.5" fill="var(--acc)"/>
    <path d="M13.5 21 Q8 17 3 20 M13.5 27 Q8 31 3 28" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</defs></svg>
<main id="m"></main>
<script>
  const rows = [
    ['h1', 'Elbowed antennae', 'Both bend forward at the elbow, like a real ant walking.'],
    ['h2', 'Elbows + jaws', 'Adds two small jaws at the front of the head.'],
    ['h3', 'One antenna + jaws', 'Fewer lines: one bent antenna seen from the side.'],
    ['h4', 'Jaws only', 'No antennae at all: a solid head with pincers in front.'],
  ];
  const mark = id => `<svg viewBox="0 0 72 40"><use href="#${id}"/></svg>`;
  document.getElementById('m').innerHTML = rows.map(([id, name, why]) => `<div class="row">
    <div class="about"><b>${name}</b>${why}</div>
    <div class="big">${mark(id)}</div>
    <div class="card" style="background:#fff;border:1px solid #dde1e8">${mark(id)}ants</div>
    <div class="card" style="background:var(--ink);color:#fff">${mark(id)}ants</div>
    <div class="icon">${mark(id)}</div><div class="fav">${mark(id)}</div></div>`).join('');
</script>
