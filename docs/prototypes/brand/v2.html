<!doctype html>
<!-- Throwaway prototype, round 2: more abstract marks and names for Ants. Open in a browser. -->
<meta charset="utf-8">
<title>Brand prototype, round 2</title>
<style>
  :root { --ink: #0e1525; --paper: #f6f7f9; --line: #dde1e8; --muted: #667085; --acc: #ff4f1f }
  body.blue { --acc: #2f6bff } body.lime { --acc: #84cc16 } body.teal { --acc: #0ea5a0 }
  body { font: 15px Inter, system-ui, sans-serif; margin: 0; background: var(--paper); color: var(--ink) }
  main { max-width: 1100px; margin: 0 auto; padding: 32px }
  h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 36px 0 14px }
  .row { display: grid; grid-template-columns: 220px 1fr 1fr 96px 40px; gap: 16px; align-items: center; margin-bottom: 16px }
  .about b { display: block; margin-bottom: 4px } .about { font-size: 13px; color: var(--muted); line-height: 1.45 } .about b { color: var(--ink); font-size: 15px }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px }
  .card.dark { background: var(--ink); color: #fff; border-color: var(--ink) }
  .lock { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 28px; letter-spacing: -.03em }
  .lock svg { height: 32px; width: auto }
  .icon { width: 96px; height: 96px; border-radius: 22px; background: var(--ink); color: #fff; display: grid; place-items: center }
  .icon svg { width: 60px; height: 60px }
  .fav svg { width: 16px; height: 16px }
  .work { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 8px }
  .work svg { height: 16px; width: auto }
  .seg { animation: pulse 1.2s infinite } .seg:nth-child(2) { animation-delay: .2s } .seg:nth-child(3) { animation-delay: .4s } .seg:nth-child(4) { animation-delay: .6s }
  @keyframes pulse { 0%, 60%, 100% { fill: #c5cbd5 } 20% { fill: var(--acc) } }
  @media (prefers-reduced-motion: reduce) { .seg { animation: none; fill: var(--acc) } }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer }
</style>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- A: the ant drawn with BPMN's own shapes: start event, task, end event. -->
  <symbol id="a" viewBox="0 0 64 64">
    <path d="M9 26 L5 16 M15 26 L19 16" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>
    <path d="M19 33 H25 M39 33 H43" stroke="currentColor" stroke-width="3"/>
    <circle cx="12" cy="33" r="7" fill="none" stroke="var(--acc)" stroke-width="3"/>
    <rect x="25" y="26" width="14" height="14" rx="4" fill="currentColor"/>
    <circle cx="52" cy="33" r="8" fill="none" stroke="currentColor" stroke-width="5"/>
  </symbol>
  <!-- B: top view, head first, marching up. Three segments in a column and a V of antennae. -->
  <symbol id="b" viewBox="0 0 64 64">
    <path d="M28 14 L22 4 M36 14 L42 4" stroke="var(--acc)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="18" r="7" fill="var(--acc)"/>
    <ellipse cx="32" cy="32" rx="4.5" ry="6" fill="currentColor"/>
    <ellipse cx="32" cy="50" rx="10" ry="11" fill="currentColor"/>
  </symbol>
  <!-- C: the trail. Dots that grow into the ant at the front, like an ellipsis that means "working". -->
  <symbol id="c" viewBox="0 0 64 64">
    <circle cx="8" cy="44" r="3" fill="currentColor" opacity=".35"/>
    <circle cx="20" cy="38" r="4" fill="currentColor" opacity=".6"/>
    <circle cx="34" cy="30" r="5.5" fill="currentColor"/>
    <circle cx="50" cy="20" r="8" fill="var(--acc)"/>
    <path d="M50 12 L46 3 M55 13 L61 6" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- D: a monogram, the jaws as a lowercase a: an open ring and a stem. -->
  <symbol id="d" viewBox="0 0 64 64">
    <path d="M44 22 A16 16 0 1 0 44 46" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    <circle cx="30" cy="34" r="5" fill="var(--acc)"/>
    <path d="M48 18 V50" stroke="var(--acc)" stroke-width="8" stroke-linecap="round"/>
  </symbol>
</defs></svg>
<main>
  <p>Accent: <button onclick="document.body.className=''">Fire</button> <button onclick="document.body.className='blue'">Blue</button> <button onclick="document.body.className='teal'">Teal</button> <button onclick="document.body.className='lime'">Lime</button></p>
  <h1>Mark · name · dark · app icon · favicon</h1>
  <div id="rows"></div>
</main>
<script>
  const rows = [
    ['a', 'ants', 'Processes that run themselves', 'BPMN ant', 'Head is a start event, body a Task. Says "BPMN" to anyone who knows it.',
      '<circle class="seg" cx="8" cy="8" r="6"/><rect class="seg" x="18" y="2" width="16" height="12" rx="3"/><circle class="seg" cx="42" cy="8" r="5"/>'],
    ['b', 'ants', 'Agents at work, while you’re away', 'Top view', 'An ant marching up, read as a column of steps.',
      '<circle class="seg" cx="6" cy="8" r="5"/><circle class="seg" cx="18" cy="8" r="4"/><circle class="seg" cx="32" cy="8" r="7"/>'],
    ['c', 'ants', 'Draw the trail. Agents follow it.', 'The trail', 'Dots grow into an ant at the front: a trail, and an ellipsis that already means "working".',
      '<circle class="seg" cx="4" cy="12" r="2.5"/><circle class="seg" cx="13" cy="10" r="3.5"/><circle class="seg" cx="24" cy="8" r="4.5"/><circle class="seg" cx="37" cy="6" r="6"/>'],
    ['d', 'ants', 'Your work, carried', 'Monogram', 'A lowercase a, the open ring is the jaws.',
      '<circle class="seg" cx="6" cy="8" r="5"/><circle class="seg" cx="20" cy="8" r="5"/><circle class="seg" cx="34" cy="8" r="5"/>'],
  ];
  const mark = id => `<svg viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
  document.getElementById('rows').innerHTML = rows.map(([id, name, tag, kind, why, work]) => `
    <div class="row">
      <div class="about"><b>${kind}</b>${why}</div>
      <div class="card"><div class="lock">${mark(id)}${name}</div><div style="color:var(--muted);font-size:14px;margin:2px 0 0 44px">${tag}</div>
        <div class="work"><svg viewBox="0 0 48 16">${work}</svg><span style="color:var(--muted)">Agent working…</span></div></div>
      <div class="card dark"><div class="lock">${mark(id)}${name}</div></div>
      <div class="icon">${mark(id)}</div>
      <div class="fav">${mark(id)}</div>
    </div>`).join('');
</script>
