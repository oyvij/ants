<!doctype html>
<!-- Throwaway prototype, round 19: the ant without its circle, centred, in the cream + dark palette. Open in a browser. -->
<meta charset="utf-8">
<title>Brand prototype, round 19: the ant without its circle</title>
<style>
  body { font: 14px Inter, system-ui, sans-serif; margin: 0; background: #f7f2ea; color: #0e1016 }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 32px }
  h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: #6b6458; margin: 30px 0 6px }
  .note { color: #6b6458; margin: 0 0 14px; max-width: 760px; line-height: 1.5 }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 14px }
  .about { width: 170px; font-size: 13px; color: #6b6458; line-height: 1.4 } .about b { display: block; color: #0e1016; font-size: 15px; margin-bottom: 3px }
  .tile { width: 128px; height: 128px; border-radius: 28px; display: grid; place-items: center; position: relative }
  .tile svg { width: 100px; height: 100px }
  .tile.guides::before, .tile.guides::after { content: ''; position: absolute; background: rgba(255, 0, 80, .45) }
  .tile.guides::before { left: 50%; top: 0; bottom: 0; width: 1px } .tile.guides::after { top: 50%; left: 0; right: 0; height: 1px }
  .cream { background: #f7f1e8; color: #0e1016; box-shadow: inset 0 0 0 1px #e9e1d3 } .dcream { background: #e9dcc8; color: #0e1016 } .dark { background: #0e1016; color: #f7f1e8 }
  .s32 svg { width: 32px; height: 32px } .s16 svg { width: 16px; height: 16px }
  .lock { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 30px; letter-spacing: -.03em; padding: 16px 22px; border-radius: 14px }
  .lock svg { width: 46px; height: 46px }
  .side { background: #0e1016; color: #f7f1e8; width: 170px; padding: 16px 12px; border-radius: 12px }
  .side .lock { font-size: 18px; padding: 0 4px 12px; gap: 8px } .side .lock svg { width: 28px; height: 28px }
  .nav { padding: 7px 10px; border-radius: 7px; font-size: 13px; color: #9aa3b2; border-left: 3px solid transparent } .nav.on { background: #1b1e27; color: #fff; border-left-color: #e9dcc8 }
  label { font-size: 13px; color: #6b6458 }
</style>
<main>
  <label><input type="checkbox" id="g" onchange="document.querySelectorAll('.tile').forEach(t => t.classList.toggle('guides', this.checked))"> Show centre lines</label>
  <h1>The ant on its own</h1>
  <p class="note">No circle: dark ant on cream, cream ant on dark. The eye is cut out, so it shows the tile behind it.</p>
  <div id="rows"></div>
  <h1>In use</h1>
  <div class="row" id="use"></div>
</main>
<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<script>
const LEGS = 'M58 55 L65 61 L67 69 M53 56 L54 63 L51 69 M48 56 L42 62 L38 68';
const BODY = '<ellipse cx="31" cy="55" rx="16" ry="13" transform="rotate(-12 31 55)"/><circle cx="47" cy="52" r="3.5"/><ellipse cx="56" cy="50" rx="8" ry="6" transform="rotate(-20 56 50)"/><circle cx="71" cy="40" r="14"/>';
const FAR = '<path d="M82.1 33.3 L82.6 31.1 L83.2 28.9 L83.8 26.8 L84.4 24.6 L85.0 22.4 L85.6 20.3 L86.5 19.0 L87.4 17.9 L88.3 16.9 L89.2 16.0 L90.1 15.4 L91.0 14.9 L91.8 14.6 L92.7 14.5 L93.5 14.5 L94.4 14.6 L95.3 15.0 L96.1 15.5 L97.0 16.2 L97.9 17.1 L98.1 16.9 L97.3 16.0 L96.4 15.2 L95.5 14.6 L94.6 14.1 L93.6 13.9 L92.7 13.8 L91.7 13.9 L90.7 14.2 L89.7 14.7 L88.6 15.3 L87.6 16.1 L86.6 17.1 L85.5 18.3 L84.4 19.7 L83.6 22.0 L82.9 24.1 L82.2 26.2 L81.4 28.4 L80.7 30.5 L79.9 32.7 Z"/>';
const NEAR = '<path d="M81.9 33.8 L83.3 32.1 L84.8 30.4 L86.2 28.6 L87.7 26.9 L89.1 25.2 L90.5 23.5 L91.7 22.7 L93.0 21.9 L94.1 21.4 L95.2 21.1 L96.1 20.9 L97.0 20.9 L97.8 21.1 L98.6 21.5 L99.3 22.1 L99.9 22.9 L100.5 23.8 L101.0 25.0 L101.5 26.4 L101.9 28.0 L102.1 28.0 L101.9 26.3 L101.5 24.9 L101.0 23.6 L100.5 22.5 L99.8 21.6 L99.0 20.9 L98.2 20.4 L97.2 20.0 L96.1 19.9 L95.0 20.0 L93.7 20.3 L92.4 20.8 L91.0 21.5 L89.5 22.5 L87.9 24.1 L86.3 25.7 L84.8 27.4 L83.2 29.0 L81.7 30.6 L80.1 32.2 Z"/>';

  const antShape = (col) => `<path d="${LEGS}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="${col}">${BODY}${FAR}${NEAR}</g>`;
  // Measure the ant, and the ant without its antennae, to centre it.
  const probe = document.getElementById('defs');
  probe.innerHTML = `<g id="all">${antShape('#000')}</g><g id="body"><path d="${LEGS}" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/><g>${BODY}</g></g>`;
  const pad = 2.25; // half the leg stroke, which getBBox leaves out
  const box = id => { const b = document.getElementById(id).getBBox(); return { x: b.x - pad, y: b.y - pad, w: b.width + 2 * pad, h: b.height + 2 * pad }; };
  const all = box('all'), body = box('body');
  // A square viewBox, 8% margin, centred on a point.
  const view = (cx, cy, size) => `${(cx - size / 2).toFixed(2)} ${(cy - size / 2).toFixed(2)} ${size.toFixed(2)} ${size.toFixed(2)}`;
  const size = Math.max(all.w, all.h) * 1.08;
  const centres = {
    box: ['Centred on the outline', 'The whole ant, antennae included, sits in the middle.', all.x + all.w / 2, all.y + all.h / 2],
    body: ['Centred on the body', 'The body sits in the middle; the thin antennae reach out to the upper right.', body.x + body.w / 2, body.y + body.h / 2 - 3],
    mix: ['Halfway', 'Between the two.', (all.x + all.w / 2 + body.x + body.w / 2) / 2, (all.y + all.h / 2 + body.y + body.h / 2 - 3) / 2],
  };
  let n = 0;
  const mark = (k) => { const [, , cx, cy] = centres[k], id = 'm' + (n++);
    return `<svg viewBox="${view(cx, cy, k === 'box' ? size : size * 1.04)}"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-50" y="-50" width="250" height="250">
      <rect x="-50" y="-50" width="250" height="250" fill="#000"/>${antShape('#fff')}<circle cx="77" cy="37" r="3.6" fill="#000"/></mask></defs>
      <rect x="-50" y="-50" width="250" height="250" fill="currentColor" mask="url(#${id})"/></svg>`; };
  document.getElementById('rows').innerHTML = Object.entries(centres).map(([k, [name, why]]) => `<div class="row">
    <div class="about"><b>${name}</b>${why}</div>
    <div class="tile cream">${mark(k)}</div><div class="tile dcream">${mark(k)}</div><div class="tile dark">${mark(k)}</div>
    <div class="s32">${mark(k)}</div><div class="s16">${mark(k)}</div></div>`).join('');
  document.getElementById('use').innerHTML = `
    <div class="lock" style="background:#fffdf9;box-shadow:inset 0 0 0 1px #e9e1d3">${mark('mix')}ants</div>
    <div class="lock dark" style="color:#f7f1e8">${mark('mix')}ants</div>
    <div class="side"><div class="lock">${mark('mix')}ants</div><div class="nav">Home</div><div class="nav">Processes</div><div class="nav on">Runs</div><div class="nav">Dashboards</div></div>`;
</script>
