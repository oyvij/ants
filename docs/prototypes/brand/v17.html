<!doctype html>
<!-- Throwaway prototype, round 17: two thin antennae from one root. Open in a browser. -->
<meta charset="utf-8">
<title>Brand prototype, round 17</title>
<style>
  :root { --ink: #0e1525; --gold: #e8b339; --line: #dde1e8; --muted: #667085 }
  body { font: 15px Inter, system-ui, sans-serif; margin: 0; background: #f6f7f9; color: var(--ink) }
  main { max-width: 1180px; margin: 0 auto; padding: 32px }
  .row { display: flex; gap: 14px; align-items: center; margin-bottom: 18px }
  .about { width: 150px; font-size: 13px; color: var(--muted); line-height: 1.4 } .about b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 3px }
  .big svg { width: 170px; height: 170px; display: block }
  .icon { width: 96px; height: 96px; border-radius: 22px; display: grid; place-items: center; flex: none }
  .icon svg { width: 78px; height: 78px }
  .s32 svg { width: 32px; height: 32px } .s16 svg { width: 16px; height: 16px }
  .card { border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 30px; letter-spacing: -.03em }
  .card svg { width: 46px; height: 46px }
</style>
<main id="m"></main>
<script>
  // Each ant: strokes (legs, antennae, jaws), solids (body parts), and holes (eye, smile) cut back out of the ant.
  const ants = {
    a: { name: 'Big head + eye', why: 'The original from round 8.', c: [52, 42], s: .86, w: 4.5,
      strokes: 'M68 28 Q64 15 74 12 Q81 10 84 15 M58 55 L65 61 L67 69 M53 56 L54 63 L51 69 M48 56 L42 62 L38 68', solids: '<ellipse cx="31" cy="55" rx="16" ry="13" transform="rotate(-12 31 55)"/><circle cx="47" cy="52" r="3.5"/><ellipse cx="56" cy="50" rx="8" ry="6" transform="rotate(-20 56 50)"/><circle cx="71" cy="40" r="14"/><circle cx="84.5" cy="16" r="3.2"/>', holes: '<circle cx="77" cy="37" r="3.6"/>' },
    r: { name: 'Elbowed, one root', why: 'Two thin antennae from one point in front of the eye: up, an elbow, tip down.', c: [57, 42], s: .84, w: 4.5,
      strokes: 'M58 55 L65 61 L67 69 M53 56 L54 63 L51 69 M48 56 L42 62 L38 68', solids: '<ellipse cx="31" cy="55" rx="16" ry="13" transform="rotate(-12 31 55)"/><circle cx="47" cy="52" r="3.5"/><ellipse cx="56" cy="50" rx="8" ry="6" transform="rotate(-20 56 50)"/><circle cx="71" cy="40" r="14"/><path d="M82.1 33.3 L82.6 31.1 L83.2 28.9 L83.8 26.8 L84.4 24.6 L85.0 22.4 L85.6 20.3 L86.5 19.0 L87.4 17.9 L88.3 16.9 L89.2 16.0 L90.1 15.4 L91.0 14.9 L91.8 14.6 L92.7 14.5 L93.5 14.5 L94.4 14.6 L95.3 15.0 L96.1 15.5 L97.0 16.2 L97.9 17.1 L98.1 16.9 L97.3 16.0 L96.4 15.2 L95.5 14.6 L94.6 14.1 L93.6 13.9 L92.7 13.8 L91.7 13.9 L90.7 14.2 L89.7 14.7 L88.6 15.3 L87.6 16.1 L86.6 17.1 L85.5 18.3 L84.4 19.7 L83.6 22.0 L82.9 24.1 L82.2 26.2 L81.4 28.4 L80.7 30.5 L79.9 32.7 Z"/><path d="M81.9 33.8 L83.3 32.1 L84.8 30.4 L86.2 28.6 L87.7 26.9 L89.1 25.2 L90.5 23.5 L91.7 22.7 L93.0 21.9 L94.1 21.4 L95.2 21.1 L96.1 20.9 L97.0 20.9 L97.8 21.1 L98.6 21.5 L99.3 22.1 L99.9 22.9 L100.5 23.8 L101.0 25.0 L101.5 26.4 L101.9 28.0 L102.1 28.0 L101.9 26.3 L101.5 24.9 L101.0 23.6 L100.5 22.5 L99.8 21.6 L99.0 20.9 L98.2 20.4 L97.2 20.0 L96.1 19.9 L95.0 20.0 L93.7 20.3 L92.4 20.8 L91.0 21.5 L89.5 22.5 L87.9 24.1 L86.3 25.7 L84.8 27.4 L83.2 29.0 L81.7 30.6 L80.1 32.2 Z"/>', holes: '<circle cx="77" cy="37" r="3.6"/>' },
    cv: { name: 'Curved, one root', why: 'The same root, two plain curves.', c: [57, 40], s: .84, w: 4.5,
      strokes: 'M58 55 L65 61 L67 69 M53 56 L54 63 L51 69 M48 56 L42 62 L38 68', solids: '<ellipse cx="31" cy="55" rx="16" ry="13" transform="rotate(-12 31 55)"/><circle cx="47" cy="52" r="3.5"/><ellipse cx="56" cy="50" rx="8" ry="6" transform="rotate(-20 56 50)"/><circle cx="71" cy="40" r="14"/><path d="M81.8 33.8 L81.8 33.8 L81.8 33.7 L81.8 33.7 L81.8 33.7 L81.9 33.7 L82.2 33.1 L82.5 29.9 L83.0 27.0 L83.5 24.3 L84.2 21.8 L84.9 19.6 L85.8 17.6 L86.7 15.7 L87.7 14.2 L88.9 12.8 L90.1 11.6 L91.4 10.7 L92.8 9.9 L94.4 9.4 L96.0 9.1 L96.0 8.9 L94.3 9.1 L92.7 9.5 L91.1 10.2 L89.7 11.1 L88.3 12.2 L87.0 13.6 L85.8 15.2 L84.7 17.0 L83.7 19.1 L82.8 21.4 L82.0 23.9 L81.2 26.6 L80.6 29.6 L80.0 32.7 L80.3 32.1 L80.3 32.2 L80.3 32.2 L80.3 32.2 L80.2 32.2 L80.2 32.2 Z"/><path d="M81.8 33.8 L81.9 33.8 L81.9 33.8 L81.9 33.8 L81.9 33.8 L81.9 33.8 L82.1 33.6 L83.8 31.0 L85.5 28.7 L87.1 26.6 L88.7 24.9 L90.2 23.4 L91.8 22.1 L93.3 21.2 L94.7 20.5 L96.1 20.1 L97.5 20.0 L98.9 20.1 L100.3 20.5 L101.6 21.2 L102.9 22.1 L103.1 21.9 L101.8 20.8 L100.4 20.0 L99.0 19.5 L97.5 19.3 L96.0 19.3 L94.4 19.6 L92.8 20.2 L91.1 21.1 L89.4 22.3 L87.6 23.7 L85.8 25.5 L84.0 27.4 L82.1 29.7 L80.1 32.2 L80.2 32.1 L80.2 32.1 L80.2 32.1 L80.2 32.1 L80.2 32.1 L80.2 32.2 Z"/>', holes: '<circle cx="77" cy="37" r="3.6"/>' },
  };
  const defs = Object.entries(ants).map(([id, a]) => {
    const body = (col) => `<path d="${a.strokes}" fill="none" stroke="${col}" stroke-width="${a.w}" stroke-linecap="round" stroke-linejoin="round"/><g fill="${col}">${a.solids}</g>`;
    return `<mask id="m-${id}"><rect width="100" height="100" fill="#fff"/>
      <g transform="translate(50 50) scale(${a.s}) translate(${-a.c[0]} ${-a.c[1]})">${body('#000')}
        <g fill="#fff" stroke="#fff">${a.holes}</g><g fill="#000">${a.shine || ''}</g></g></mask>
      <symbol id="${id}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="var(--c)" mask="url(#m-${id})"/></symbol>`;
  }).join('');
  document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute"><defs>${defs}</defs></svg>`);
  const m = (id, c) => `<svg style="--c:${c}"><use href="#${id}"/></svg>`;
  document.getElementById('m').innerHTML = Object.entries(ants).map(([id, a]) => `<div class="row">
    <div class="about"><b>${a.name}</b>${a.why}</div>
    <div class="big">${m(id, 'var(--ink)')}</div>
    <div class="icon" style="background:var(--gold)">${m(id, 'var(--ink)')}</div>
    <div class="icon" style="background:var(--ink)">${m(id, 'var(--gold)')}</div>
    <div class="s32">${m(id, 'var(--ink)')}</div><div class="s16">${m(id, 'var(--ink)')}</div>
    <div class="card" style="background:#fff;border:1px solid var(--line)">${m(id, 'var(--ink)')}ants</div>
    <div class="card" style="background:var(--ink);color:#fff">${m(id, 'var(--gold)')}ants</div></div>`).join('');
</script>
