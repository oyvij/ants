<!--
  The Ants app icon: the ant on a cream tile, full-bleed, for icon-192.png and icon-512.png.
  The ant is src/main/resources/static/ant.svg, the drawing Home's ant (ant-alive.svg) animates.
  Render it to icon-N.png, for N = 192 and 512, with the Chromium that the playwright Gradle task installs;
  the full command is in README.md, under Icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e8"/>
      <stop offset="1" stop-color="#e9dcc8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <image href="../src/main/resources/static/ant.svg" xlink:href="../src/main/resources/static/ant.svg" x="56" y="56" width="400" height="400"/>
</svg>
