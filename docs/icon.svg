<!--
  The Ants app icon: the logo (src/main/resources/static/logo.svg) on a cream tile, full-bleed, for icon-192.png and
  icon-512.png.
  Render it to icon-N.png, for N = 192 and 512, with the Chromium that the playwright Gradle task installs;
  the full command is in README.md, under Icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f7f1e8"/>
  <image href="../src/main/resources/static/logo.svg" xlink:href="../src/main/resources/static/logo.svg" x="66" y="66" width="380" height="380"/>
</svg>
