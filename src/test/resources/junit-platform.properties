# Test classes run in a random order, so none leans on what another left behind; build.gradle.kts sets and prints the seed.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
# A test that hangs fails after 2 minutes, naming itself, instead of stalling the run; the slowest waits 30 s.
# In a thread of its own, so a test stuck where an interrupt can't reach, such as reading a process's output, fails too.
junit.jupiter.execution.timeout.default=2 m
junit.jupiter.execution.timeout.mode.default=enabled
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
