  .ov { font: 600 11px Inter, system-ui, sans-serif; padding: 2px 8px; border-radius: 20px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; box-shadow: var(--sh); }

  .drawer .dh { padding: 16px 18px 10px; border-bottom: 1px solid var(--line2); } .drawer .db { padding: 14px 18px; overflow: auto; flex: 1; } .drawer .df { padding: 12px 18px; border-top: 1px solid var(--line); }

  .sofar { background: var(--accSoft); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; } .sofar p { margin: 4px 0 0; }
  .todo { font-size: 13px; padding: 2px 0; } .todo.done { color: var(--muted); text-decoration: line-through; } .todo.now { font-weight: 600; color: var(--run); }

<script>

const ALIAS_NOW = { opus: "claude-opus-5-5", sonnet: "claude-sonnet-5-5", haiku: "claude-haiku-5-5", fable: "claude-fable-5-1" }
const modelName = id => { const m = id.match(/^claude-([a-z]+)-(.*?)(-\d{8})?$/); if (!m) return id
  const [, fam, ver] = m; return fam[0].toUpperCase() + fam.slice(1) + " " + (/^\d/.test(ver) ? ver.replace(/-/g, ".") : ver) }
const CODEX_MODELS = ["default", "gpt-5", "gpt-5-codex"]
const S_MODELS_CHECKED = "08:12"
function modelSelect(d, ro) {
  if (d.cli !== "claude") return `<select ${ro} onchange="S.draft.model=this.value">${CODEX_MODELS.map(m => `<option ${m === d.model ? "selected" : ""}>${m}</option>`).join("")}</select>
    <div class="help" style="margin-top:4px">Codex's models ship with Ants. Check during the build whether <code>codex</code> can list them itself.</div>`
  const known = ["default", ...Object.keys(ALIAS_NOW), ...CLAUDE_MODELS.map(m => m[0])], other = d.model && !known.includes(d.model)
  const opt = (v, label) => `<option value="${v}" ${v === d.model ? "selected" : ""}>${label}</option>`
  const dep = CLAUDE_MODELS.find(m => m[0] === d.model && m[1] === "Deprecated")
  return `<select ${ro} onchange="if(this.value==='__other'){S.draft.model='';S.draft.otherModel=true}else{S.draft.model=this.value;S.draft.otherModel=false};formRender()">
      ${opt("default", "default · whatever the CLI picks")}
      <optgroup label="Always the newest">${Object.entries(ALIAS_NOW).map(([a, id]) => opt(a, `${a} · newest ${a[0].toUpperCase() + a.slice(1)}, now ${modelName(id)}`)).join("")}</optgroup>
      <optgroup label="A fixed version">${CLAUDE_MODELS.filter(m => m[1] === "Active").map(([id]) => opt(id, `${modelName(id)} · ${id}`)).join("")}</optgroup>
      <optgroup label="Deprecated: still runs, retiring">${CLAUDE_MODELS.filter(m => m[1] === "Deprecated").map(([id, , when]) => opt(id, `${modelName(id)} · ${id} · retires ${when}`)).join("")}</optgroup>
      <option value="__other" ${other || d.otherModel ? "selected" : ""}>Other model ID…</option></select>
    ${other || d.otherModel ? `<input class="mono" style="margin-top:6px" ${ro} placeholder="e.g. claude-opus-6" value="${esc(d.model || "")}" onchange="S.draft.model=this.value.trim();formRender()">
      <div class="help" style="margin-top:4px">Not on Anthropic's list yet. The check before a Run tries it once on your login.</div>` : ""}
    ${dep ? `<div class="warn">Deprecated: it retires ${dep[2]}. Pick a newer version, or <b>opus</b> / <b>sonnet</b> to always get the newest.</div>` : ""}
    <div class="help" style="margin-top:6px">From Anthropic's public model list, refreshed with Ants' update check (last ${S_MODELS_CHECKED}). <button class="ghost small" onclick="toast('Checked: no new models.')">Check now</button></div>`
}

const SZ = { startEvent: [36, 36], endEvent: [36, 36], exclusiveGateway: [50, 50], parallelGateway: [50, 50], serviceTask: [120, 80], userTask: [120, 80], task: [120, 80] }
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
function bpmnXml(pid, nodes, flows) {
  const N = Object.fromEntries(nodes.map(([id, type, name, cx, cy, timer]) => [id, { id, type, name, cx, cy, timer, w: SZ[type][0], h: SZ[type][1] }]))
  const inc = {}, out = {}; flows.forEach(([f, a, b]) => { (out[a] ||= []).push(f); (inc[b] ||= []).push(f) })
  const els = Object.values(N).map(n => `<bpmn:${n.type} id="${n.id}" name="${xesc(n.name || "")}">${(inc[n.id] || []).map(f => `<bpmn:incoming>${f}</bpmn:incoming>`).join("")}${(out[n.id] || []).map(f => `<bpmn:outgoing>${f}</bpmn:outgoing>`).join("")}${n.timer ? `<bpmn:timerEventDefinition id="${n.id}_timer"/>` : ""}</bpmn:${n.type}>`).join("")
  const fls = flows.map(([f, a, b, name]) => `<bpmn:sequenceFlow id="${f}" name="${xesc(name || "")}" sourceRef="${a}" targetRef="${b}"/>`).join("")
  const shapes = Object.values(N).map(n => {
    const gw = n.type.includes("Gateway"), label = n.name && !n.type.endsWith("Task")
    const ly = gw ? n.cy - n.h / 2 - 20 : n.cy + n.h / 2 + 4
    return `<bpmndi:BPMNShape id="${n.id}_di" bpmnElement="${n.id}"${gw ? ' isMarkerVisible="true"' : ""}><dc:Bounds x="${n.cx - n.w / 2}" y="${n.cy - n.h / 2}" width="${n.w}" height="${n.h}"/>${label ? `<bpmndi:BPMNLabel><dc:Bounds x="${n.cx - 45}" y="${ly}" width="90" height="14"/></bpmndi:BPMNLabel>` : ""}</bpmndi:BPMNShape>`
  }).join("")
  const edges = flows.map(([f, a, b, name, wps]) => {
    const s = N[a], t = N[b], pts = wps || [[s.cx + s.w / 2, s.cy], [t.cx - t.w / 2, t.cy]]
    return `<bpmndi:BPMNEdge id="${f}_di" bpmnElement="${f}">${pts.map(([x, y]) => `<di:waypoint x="${x}" y="${y}"/>`).join("")}${name ? `<bpmndi:BPMNLabel><dc:Bounds x="${pts[0][0] + 6}" y="${pts[0][1] + 4}" width="70" height="14"/></bpmndi:BPMNLabel>` : ""}</bpmndi:BPMNEdge>`
  }).join("")
  return `<?xml version="1.0" encoding="UTF-8"?><bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="defs_${pid}" targetNamespace="http://ants.local/bpmn"><bpmn:process id="${pid}" isExecutable="true">${els}${fls}</bpmn:process><bpmndi:BPMNDiagram id="d_${pid}"><bpmndi:BPMNPlane id="p_${pid}" bpmnElement="${pid}">${shapes}${edges}</bpmndi:BPMNPlane></bpmndi:BPMNDiagram></bpmn:definitions>`
}

// In Ants this all comes off the stream-json events over SSE: the clock from the launch, tokens from usage, the activity from the latest event.
const key = (r, t) => `${r.id}/${t.id}`

function feedLine(l, typing) {
  if (l.k === "tool") return `<div class="tool new">${esc(l.s)}</div>`
  if (l.k === "think") return `<details class="new"><summary>Thinking</summary><div class="muted">…</div></details>`
  return `<div class="new ${typing ? "caret" : ""}" data-type="${typing ? esc(l.s) : ""}">${typing ? "" : esc(l.s)}</div>`
}
setInterval(() => {

    if (t.st !== "running") continue
    t.el++; t.tok += 40 + (TICK * 37 + t.el * 13) % 260
    const k = key(r, t)
    document.querySelectorAll(`[data-el="${k}"]`).forEach(e => e.textContent = fmtEl(t.el))
    document.querySelectorAll(`[data-tok="${k}"]`).forEach(e => e.textContent = fmtTok(t.tok))
    document.querySelectorAll(`[data-subel="${k}"]`).forEach((e, i) => e.textContent = fmtEl(Math.max(0, t.el - 20 - i * 9)))

    document.querySelectorAll(`[data-sumage="${k}"]`).forEach(e => e.textContent = fmtEl(t.sumAge))

    <div class="card"><h3>${icon("bell")} Waiting on you <a class="small" style="margin-left:auto;font-weight:500" href="#/notifications">All ${ns.length}</a></h3>${noteTable(ns.slice(0, 4), true)}</div>
    <div class="grid2"><div class="card"><h3>${icon("runs")} Working now</h3>
      ${working.map(r => `<div style="padding:7px 0;border-bottom:1px solid var(--line2)"><a href="#/runs/${r.id}"><b>${esc(r.id)}</b></a><div>${runNow(r)}</div></div>`).join("")}</div>
    <div><div class="card"><h3>⏰ Coming up</h3>${upcoming().map(({ p }) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line2)"><a class="grow" href="#/processes/${p.id}">${esc(p.name)}</a><span class="small muted">${nextText(p.schedule)}</span></div>`).join("") || '<div class="muted small">Nothing scheduled.</div>'}</div>
    <div class="card"><h3>${icon("proc")} Start a Run</h3>
      ${S.processes.map(p => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line2)"><a class="grow" href="#/processes/${p.id}">${esc(p.name)}</a>${p.ready ? "" : '<span class="pill p-failed">Can\'t start</span>'}</div>`).join("")}</div></div></div>`
}

function noteTable(ns, bare) {
  if (!ns.length) return `<div class="muted">Nothing waits on you.</div>`
  const rows = ns.map(({ r, t }) => `<tr class="click" onclick="go('${taskHref(r, t)}')"><td style="width:96px"><span class="tag t-${tagOf(t)}">[${tagOf(t)}]</span></td>
    <td><b>${esc(r.id)}</b> · ${esc(t.name)}<div class="muted small">${esc(proc(r.proc).name)}</div></td><td>${esc(t.summary)}</td><td class="muted small" style="white-space:nowrap">${ago(t.waited)}</td></tr>`).join("")
  return bare ? `<table style="box-shadow:none">${rows}</table>` : `<table><tr><th>Tag</th><th>Run · Task</th><th>Summary</th><th>Waiting</th></tr>${rows}</table>`
}
const pNotifications = () => ph("Notifications", { sub: "Every Task waiting on you, oldest first. An entry goes the moment you act." }) + noteTable(notes())

function runsTable(rs, actions) {
  if (!rs.length) return `<div class="card muted">None.</div>`
  return `<table><tr><th>Run</th><th>Process</th><th>Now</th><th>Started</th>${actions ? "<th></th>" : ""}</tr>
    ${rs.map(r => `<tr class="click" onclick="go('#/runs/${r.id}')"><td><b>${esc(r.id)}</b></td><td class="muted">${esc(proc(r.proc).name)}</td>
      <td>${runNow(r)}</td><td class="muted small">${esc(r.started)}</td>
      ${actions ? `<td>${r.state === "failed" ? `<button onclick="event.stopPropagation();dismiss('${r.id}')">Dismiss</button>` : `<a href="#/runs/${r.id}" onclick="event.stopPropagation()">Report</a>`}</td>` : ""}</tr>`).join("")}</table>`
}
function pRuns() {
  return ph("Runs", { acts: `<button class="primary" onclick="go('#/processes')">Start a Run</button>`, sub: `${running()} of ${S.cap} Agent Tasks running.` })
    + (upcoming().length ? `<h2>Coming up</h2><table>${upcoming().map(({ p }) => `<tr class="click" onclick="go('#/processes/${p.id}')"><td><b>${esc(p.name)}</b></td><td class="small">${schedText(p.schedule)}</td><td class="muted small">${nextText(p.schedule)}</td></tr>`).join("")}</table>` : "")
    + `<h2>Live</h2>${runsTable(S.runs.filter(r => r.state === "live"))}
    <h2>Ended</h2><div class="help">Done Runs leave their Report. Failed Runs keep their Run workspace until you dismiss them.</div>${runsTable(S.runs.filter(r => r.state !== "live"), true)}`
}

function diagramBox(kind, procId, runId) {
  return `<div class="dia ${kind === "modeler" ? "modeler" : ""}" data-bpmn="${kind}" data-proc="${procId}" data-run="${runId || ""}">
    <div class="nolib">Loading the diagram… (bpmn-js comes from unpkg.com; this needs the network)</div>
    ${kind === "viewer" ? `<div class="legend"><span class="pill p-running">Running</span><span class="pill p-waiting">Waiting on you</span><span class="pill p-done">Done</span><span class="pill p-quiet">Queued / paused</span></div>` : ""}
    <div class="zoom"><button data-z="in">＋</button><button data-z="out">－</button><button data-z="fit">Fit</button><button data-z="full">⛶</button></div></div>`
}
function pRun(id) {
  const r = run(id); if (!r) return ph("No such Run")
  const live = r.state === "live", p = proc(r.proc)
  return ph(esc(r.id), { crumbs: [`<a href="#/runs">Runs</a>`, esc(r.id)],
      acts: live ? `<button class="danger" onclick="cancelRun('${r.id}')">Cancel the Run</button>` : r.state === "failed" ? `<button onclick="dismiss('${r.id}')">Dismiss</button>` : "",
      sub: `<a href="#/processes/${r.proc}">${esc(p.name)}</a> · started ${esc(r.started)} · branch <code>ants/${esc(r.id)}</code> · repos ${r.repos.map(x => `<code>${esc(x)}</code>`).join(" ") || "none yet"} · Vault ${esc(p.vault)}` })
    + diagramBox("viewer", r.proc, r.id) + `<div class="help" style="margin-top:6px">Drag to pan, Ctrl/⌘ + scroll to zoom. Click a Task to open it.</div>
    <h2>Tasks</h2><table><tr><th>Task</th><th>Agent · Skill</th><th>State</th><th>Tokens</th></tr>
    ${r.tasks.map(t => { const pr = propsOf(r, t); return `<tr class="click" onclick="go('${taskHref(r, t)}')"><td><b>${esc(t.name)}</b>${t.round ? ` <span class="muted small">round ${t.round}</span>` : ""}${t.st === "running" && t.subs ? ` <span class="muted" title="Subagents">⑂ ${t.subs}</span>` : ""}</td>
      <td class="muted small">${pr.kind === "agent" ? `${esc(pr.agent)} · ${esc(pr.skill)}` : pr.kind === "user" ? "User Task" : "Built-in Task"}</td>
      <td>${t.st === "running" ? `<span class="small">${liveLine(r, t)}</span>` : badge(t)}</td><td class="muted small num">${t.st === "running" ? `<span data-tok="${key(r, t)}">${fmtTok(t.tok)}</span>` : t.tokens || ""}</td></tr>` }).join("")}</table>
    ${r.state === "failed" ? `<h2>Run workspace</h2><div class="card">Kept at <code>~/.ants/runs/${esc(r.id)}/workspace</code> until you dismiss the Run.</div>` : ""}
    ${r.state === "done" ? `<h2>Report</h2><div class="card">${mdView(`**What was done.** Scouted ${r.repos.join(", ") || "nothing"}, grilled the spec over 3 Rounds (14 questions, 11 answered by you), wrote and approved \`specs/${r.id}.md\`.\n\n**Repos changed.** ${r.repos.map(x => `\`${x}\` on \`ants/${r.id}\`, 1 commit, not pushed`).join("; ") || "none"}\n\n**Tokens.** ${r.tasks.filter(t => t.tokens).map(t => `${t.name} ${t.tokens}`).join(" · ")}`)}</div>` : `<div class="help" style="margin-top:10px">The Report appears here when the Run ends.</div>`}`
}

function transcript(r, t) {
  if (t.st === "queued") return `<div class="tr"><div class="sys">No launch yet.</div></div>`
  const pr = propsOf(r, t)
  const sub = (n, d, live) => `<details class="sub" id="sub${n}"><summary>⑂ Explore · ${d}${live ? ` <span class="small"><span class="spin">✻</span> <span class="num" data-subel="${key(r, t)}">${fmtEl(Math.max(0, t.el - 20 - (n - 1) * 9))}</span></span>` : ""}</summary>
    <div class="muted small">Prompt: ${d}. Report file paths and line numbers.</div><div class="tool">Grep "#[0-9a-f]{6}" repos/web/src</div><div class="tool">Read repos/web/src/theme.ts</div></details>`
  const end = { running: `<div class="tool">Read repos/web/src/settings/Preferences.tsx</div>${t.subs ? sub(1, "Find every hard-coded colour", true) : ""}${t.subs > 1 ? sub(2, "Check how settings persist", true) : ""}
      <div class="feed">${(t.live || []).map(l => feedLine(l)).join("")}</div><div class="status">${liveLine(r, t)}</div>`,
    done: `<div>Everything the Task promised is in place; returning the Result.</div><div class="div">Result</div><pre class="mono" style="background:var(--line2);padding:8px;border-radius:8px">{ "outcome": "done", "summary": "…", "output": { … } }</pre>`,
    paused: `<div class="sys">⏸ Paused at the usage limit · resumes after ${S.paused.claude || "the reset"}</div>`,
    round: `<div class="div">Result: a Round of 4 questions</div><div class="sys">Waiting for the Round to be answered, then this session resumes</div>`,
    stuck: `<div class="div">Result: stuck</div>`, failed: `<div class="sys">Invalid Result, retried once</div><div class="sys">Invalid Result again · [failed]</div>`,
    stopped: `<div class="tool">Edit specs/onboarding-email.md</div><div class="sys">Stopped by you</div>` }[t.st] || ""
  return `<div class="tr" id="tr" data-run="${key(r, t)}"><details><summary>Opening prompt</summary><pre class="mono">Run the ${esc(pr.skill)} Skill for this Task. Inputs follow as JSON.\n${esc(JSON.stringify(Object.fromEntries((pr.inputs || []).map(i => [i.slice(2, -1), "…"]))))}</pre></details>
    <div class="div">Launch 1 · ${esc(r.started)} · ${t.tokens || "0"} tokens</div>
    <div>I'll read the brief first, then look at how the code handles this today.</div>
    <div class="tool">Read scout/brief.md</div><details><summary>Thinking</summary><div class="muted">…</div></details>
    ${t.round > 1 ? `<div class="div">Launch ${t.round} · resumed with the answers to round ${t.round - 1}</div>` : ""}
    ${(t.sent || []).map(m => `<div class="you">${mdView(m)}</div>`).join("")}${end}</div>`
}

function taskHead(r, t) {
  const pr = propsOf(r, t)
  return ph(`${esc(t.name)} ${badge(t)}`, { crumbs: [`<a href="#/runs">Runs</a>`, `<a href="#/runs/${r.id}">${esc(r.id)}</a>`, esc(t.name)],
    acts: pr.kind === "agent" ? `<span class="muted small"><a href="#/agents/${pr.agent}">${esc(pr.agent)}</a> · <a href="#/skills/${pr.skill}">${esc(pr.skill)}</a> · ${t.st === "running" ? `<span class="num" data-tok="${key(r, t)}">${fmtTok(t.tok)}</span>` : t.tokens || 0} tokens</span>` : `<span class="muted small">${pr.kind === "user" ? "User Task" : "Built-in Task"}</span>`,
    sub: t.summary ? esc(t.summary) : "" })
}
// "So far": a short paragraph of what the Agent has done, rewritten every couple of minutes while it runs
// (in Ants: a haiku call over the new Transcript lines, its tokens counted on the Task), plus the Agent's own task list (TaskCreate / TaskUpdate; TodoWrite is off by default now).
const SOFAR = {
  grill: ["Read the scout's brief and the theme code in **web**. Two Subagents are mapping every hard-coded colour and how settings are stored.",
    "Header and Sidebar can use the theme tokens as they are; the chart colours need a dark palette of their own. Now checking the theme tests.",
    "The theme tests pass. Drafting round 3: where the toggle sits, the default, chart colours and where the choice is stored."],
  backend: ["Planned 3 tickets for the reindex. On ticket 1, retrying a failed reindex job: wrote the failing test, now changing `ReindexJob`.",
    "Ticket 1 is done and committed. On ticket 2, the alias swap: reading how the search client creates indices.", "Tickets 1 and 2 are committed; running the full search test suite before ticket 3."],
  frontend: ["Adding the reindex progress bar to the admin page. Reused the existing `ProgressBar`; wiring it to the new status endpoint.",
    "The progress bar polls every 5 s and stops when done. Writing the component test."],
}
const TODOS = { grill: ["Read the brief", "Map hard-coded colours", "Check how settings persist", "Run the theme tests", "Write round 3"],
  backend: ["Ticket 1: retry failed jobs", "Ticket 2: alias swap", "Ticket 3: backfill batches", "Run the full suite"], frontend: ["Progress bar", "Poll the status endpoint", "Component test"] }
function soFar(r, t) {
  const pr = propsOf(r, t); if (pr.kind !== "agent") return ""
  const k = key(r, t), list = SOFAR[t.id], live = t.st === "running"
  const text = live && list ? list[Math.min(t.sumN || 0, list.length - 1)] : t.st === "done" ? (t.summary || `Finished ${t.name.toLowerCase()}. The Result is in the Transcript.`) : t.summary || (list ? list[0] : "Nothing yet.")
  const todos = live || t.st === "done" ? TODOS[t.id] || [] : []
  const doneN = live ? Math.min(todos.length - 1, Math.floor((t.live?.length || 0) / 3) + (t.sumN || 0) + 1) : todos.length
  return `<div class="sofar" data-sofar="${k}"><div class="row small"><b>So far</b><span class="grow"></span>${live ? `<span class="muted">updated <span data-sumage="${k}">${fmtEl(t.sumAge || 0)}</span> ago</span>` : ""}</div>
    ${mdView(text)}${todos.length ? `<div style="margin-top:8px">${todos.map((x, i) => `<div class="todo ${i < doneN ? "done" : i === doneN && live ? "now" : ""}">${i < doneN ? "☑" : i === doneN && live ? "◐" : "☐"} ${esc(x)}</div>`).join("")}</div>` : ""}</div>`
}
function openDrawer(rid, tid) {
  const r = run(rid), t = r.tasks.find(x => x.id === tid), pr = propsOf(r, t), k = key(r, t)
  S.drawer = { rid, tid }
  const tail = pr.kind === "agent" && t.st !== "queued" ? `<h3 style="font-size:13px;margin:4px 0 8px">Latest output</h3><div class="tr" data-run="${k}">
      ${(t.live || []).slice(-6).map(l => feedLine(l)).join("") || `<div class="tool">Read scout/brief.md</div><div>I'll read the brief first, then look at how the code handles this today.</div>`}<div class="feed"></div>
      ${t.st === "running" ? `<div class="status">${liveLine(r, t)}</div>` : ""}</div>` : ""
  const act = WAITING.includes(t.st) ? `<a class="btn primary" style="display:inline-block;text-decoration:none" href="${taskHref(r, t)}">${{ questions: "Answer the round", approve: t.id === "review" ? "Review the changes" : "Approve or send back" }[t.tag] || "Continue or start fresh"}</a>` : ""
  const body = pr.kind === "agent" ? soFar(r, t) + tail : pr.kind === "user" ? `<div class="sofar">${mdView(t.summary || "You did this.")}</div>` : `<div class="sofar">Ants did this itself; there is no Transcript.</div>`
  const foot = t.st === "running" ? `<div class="df">${md("dmsg", "", "Comment to the Agent. It reads it at its next tool call.")}<div class="row" style="margin-top:8px"><span class="grow"></span>
      <button onclick="stop('${rid}','${tid}');closeDrawer();render()">Stop</button><button class="primary" onclick="sendFromDrawer('${rid}','${tid}')">Send</button></div></div>`
    : act ? `<div class="df">${act}</div>` : ""
  document.getElementById("drawer").innerHTML = `<div class="drawer"><div class="dh"><div class="row"><div class="grow"><div class="muted small">${esc(r.id)} · ${pr.kind === "agent" ? `${esc(pr.agent)} · ${esc(pr.skill)}` : pr.kind === "user" ? "User Task" : "Built-in Task"}</div>
      <h3 style="margin:2px 0 6px;font-size:16px">${esc(t.name)}</h3></div><button class="ghost" onclick="closeDrawer()" title="Close (Esc)">✕</button></div>
      <div class="row">${t.st === "running" ? `<span class="small">${liveLine(r, t)}</span>` : badge(t)}<span class="grow"></span><a class="small" href="${taskHref(r, t)}">Full Transcript →</a></div></div>
    <div class="db">${body}${(t.sent || []).map(m => `<div style="background:var(--accSoft);padding:8px 12px;border-radius:8px;margin-top:8px"><b class="small">You</b>${mdView(m)}</div>`).join("")}</div>${foot}</div>`
  window.mountEditors?.()
}
function sendFromDrawer(rid, tid) { const m = document.getElementById("dmsg").value; if (!m) return; (run(rid).tasks.find(x => x.id === tid).sent ||= []).push(m); openDrawer(rid, tid) }
function closeDrawer() { S.drawer = null; const d = document.getElementById("drawer"); if (d) d.innerHTML = "" }
addEventListener("keydown", e => { if (e.key === "Escape" && S.drawer) closeDrawer() })

function pTask(rid, tid) {
  const r = run(rid), t = r?.tasks.find(x => x.id === tid); if (!t) return ph("No such Task")
  if (t.st === "waiting" && t.tag === "questions") return pAnswer(r, t)
  if (t.st === "waiting" && t.id === "review") return pReview(r, t)
  if (t.st === "waiting" && t.tag === "approve") return pApprove(r, t)
  if (["stuck", "failed", "stopped"].includes(t.st)) return pStuck(r, t)
  const pr = propsOf(r, t)
  if (pr.kind !== "agent") return taskHead(r, t) + `<div class="card">${pr.kind === "builtin" ? "Ants did this itself; there is no Transcript." : "You answered this."}</div>`
  const chips = t.st === "running" && t.subs ? `<div class="chips">${["Find every hard-coded colour", "Check how settings persist"].slice(0, t.subs)
    .map((c, i) => `<span class="chip" onclick="const d=document.getElementById('sub${i + 1}');d.open=true;d.scrollIntoView({block:'center'})"><span class="spin" style="color:inherit">✻</span> Explore · ${c} · <span class="num" data-subel="${key(r, t)}">${fmtEl(Math.max(0, t.el - 20 - i * 9))}</span></span>`).join("")}</div>` : ""
  const ans = r.tasks.find(x => x.tag === "questions")
  const round = t.st === "round" && ans ? `<div class="card" style="border-color:var(--wait)">This Task asked round ${t.round}. <a href="${taskHref(r, ans)}">Answer the round</a> and its session resumes.</div>` : ""
  const composer = t.st === "running" ? `<div class="composer"><div><div class="grow">${md("msg", "", "Message the Agent. It sees it at its next tool call.")}</div>
    <button onclick="stop('${r.id}','${t.id}')">Stop</button><button class="primary" onclick="send('${r.id}','${t.id}')">Send</button></div></div>` : ""
  return taskHead(r, t) + soFar(r, t) + chips + round + transcript(r, t) + composer
}

function pAnswer(r, t) {
  const qs = [["Who exports", "Who gets the export button: everyone who can see invoices, or only admins?", "Everyone who can see the invoice list; the export holds exactly what they can already see."],
    ["Which invoices", "Does the export take the invoices currently filtered on screen, or all of them?", "The **current filter**, so what you see is what you get."]]
  return taskHead(r, t) + `<div class="card" style="background:var(--accSoft);border-color:#c7d2fe">The answer screen is settled (<a href="answer-page.html" target="_blank">answer-page prototype</a>); this stub shows its text area as a markdown editor.</div>
    ${qs.map(([title, q, rec], i) => `<div class="card"><div class="muted small">Question ${i + 1} of 4 · ${title}</div><p style="font-size:17px;font-weight:600;margin:4px 0 10px">${esc(q)}</p>${md("q" + i, rec)}</div>`).join("")}
    <div class="composer"><div><span class="grow"></span><button class="primary" onclick="act('${r.id}','${t.id}')">Send the round</button></div></div>`
}
function pApprove(r, t) {
  return taskHead(r, t) + `<div class="help">Shows the Result of <a href="${taskHref(r, r.tasks.find(x => x.id === "tospec"))}">Write the spec</a> and the files it references.</div>
    <div class="card"><div class="muted small mono">specs/search-reindex.md</div>${mdView("# Zero-downtime reindex\n\nBuild a **shadow index**, backfill it with a job, then swap the alias. Reads keep hitting the old index until the swap.\n\n## Steps\n\n1. Create `products_v2` with the new mapping\n2. Backfill from Postgres in batches of 5,000\n3. Swap the `products` alias atomically")}</div>
    ${field("Comment", "Required to send back. The Agent's session resumes with it.", "", md("cmt", ""))}
    <div class="composer"><div><span class="grow"></span><button onclick="if(!document.getElementById('cmt').value)return alert('Send back needs a comment');act('${r.id}','${t.id}','back')">Send back</button>
    <button class="primary" onclick="act('${r.id}','${t.id}')">Approve</button></div></div>`
}
// Reviewing an implementation: an Agent wrote a walkthrough of the changes; the user reads it as a story and approves the push.
function pReview(r, t) {
  const story = [
    ["The retry policy", "billing", "Failed card payments now retry three times, with backoff of 1 h, 6 h and 24 h. The policy is a value object so the numbers live in one place.",
      "@@ PaymentRetryPolicy.kt @@\n+data class PaymentRetryPolicy(val delays: List<Duration> = listOf(1.hours, 6.hours, 24.hours))\n+  fun next(attempt: Int) = delays.getOrNull(attempt)"],
    ["Where it hooks in", "billing", "`PaymentFailedHandler` used to mark the invoice unpaid at once. It now schedules a retry and only marks it unpaid after the last one.",
      "@@ PaymentFailedHandler.kt @@\n-    invoice.markUnpaid()\n+    policy.next(event.attempt)?.let { retries.schedule(invoice, it) }\n+      ?: invoice.markUnpaid()"],
    ["What the customer sees", "web", "A banner on the invoice page says a retry is planned and when. It reads the new `nextRetryAt` field, so the frontend needs no polling.",
      "@@ InvoiceBanner.tsx @@\n+{invoice.nextRetryAt && <Banner tone=\"info\">We'll try your card again {relative(invoice.nextRetryAt)}.</Banner>}"],
    ["Tests", "billing, web", "12 new tests; both repos' suites pass. The walkthrough Agent ran them again after the last commit.", ""],
  ]
  return taskHead(r, t) + `<div class="grid3" style="margin-bottom:14px">
    ${[["billing", "6 files", "+184 −22", "3 commits"], ["web", "3 files", "+41 −3", "1 commit"]].map(([n, f, d, c]) => `<div class="card"><b class="mono">${n}</b> <span class="muted small">on ants/${esc(r.id)}</span><div class="small">${f} · <span style="color:var(--ok)">${d.split(" ")[0]}</span> <span style="color:var(--bad)">${d.split(" ")[1]}</span> · ${c}</div></div>`).join("")}
    <div class="card"><b>Tests</b><div class="small"><span class="pill p-done">Passing</span> 412 billing · 96 web</div></div></div>
    <div class="walk"><nav><b class="small muted" style="padding:0 10px 6px">THE STORY</b>${story.map(([h], i) => `<a href="javascript:document.getElementById('st${i}').scrollIntoView({block:'start'})">${i + 1}. ${h}</a>`).join("")}</nav>
    <div>${story.map(([h, repo, prose, diff], i) => `<div class="card" id="st${i}"><div class="muted small">${i + 1} of ${story.length} · <span class="mono">${repo}</span></div><h3 style="font-size:16px;margin:2px 0 6px">${h}</h3>${mdView(prose + (diff ? "\n\n```diff\n" + diff + "\n```" : ""))}</div>`).join("")}
    ${field("Comment", "Required to send back: the implementers resume with it. Approving pushes both branches.", "", md("cmt", ""))}</div></div>
    <div class="composer"><div><span class="grow muted small">Nothing is pushed until you approve.</span><button onclick="if(!document.getElementById('cmt').value)return alert('Send back needs a comment');act('${r.id}','${t.id}','back')">Send back</button>
    <button class="primary" onclick="act('${r.id}','${t.id}')">Approve and push</button></div></div>`
}
function pStuck(r, t) {
  const lbl = { stuck: "What it needs", failed: "Why it failed", stopped: "Where it stopped" }[t.st]

// ---------- schedules ----------
// A schedule is the Process's timer start event (Operaton keeps the timer, so it survives restarts).
// The Process page edits it in words; the cron it writes is shown, and editable under Advanced.
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
const EVERY = [["hour", "Every hour"], ["day", "Every day"], ["weekday", "Every weekday"], ["week", "Every week"], ["month", "Every month"]]
function cronOf(sc) {
  if (sc.cron) return sc.cron
  const [h, m] = sc.at.split(":").map(Number)
  return { hour: `${m} * * * *`, day: `${m} ${h} * * *`, weekday: `${m} ${h} * * MON-FRI`, week: `${m} ${h} * * ${sc.on.toUpperCase()}`, month: `${m} ${h} ${sc.dom} * *` }[sc.every]
}
function schedText(sc) {
  if (sc.cron) return `On cron <code>${esc(sc.cron)}</code>`
  return { hour: `Every hour at :${sc.at.split(":")[1]}`, day: `Every day at ${sc.at}`, weekday: `Every weekday at ${sc.at}`, week: `Every ${sc.on} at ${sc.at}`, month: `On day ${sc.dom} of every month at ${sc.at}` }[sc.every]
}
function nextRun(sc) {
  if (sc.cron) return null
  const now = new Date(), [h, m] = sc.at.split(":").map(Number), d = new Date(now); d.setSeconds(0, 0)
  if (sc.every === "hour") { d.setMinutes(m); if (d <= now) d.setHours(d.getHours() + 1); return d }
  d.setHours(h, m)
  const ok = x => sc.every === "day" || (sc.every === "weekday" && x.getDay() % 6 !== 0) || (sc.every === "week" && x.getDay() === DAYS.indexOf(sc.on)) || (sc.every === "month" && x.getDate() === +sc.dom)
  for (let i = 0; i < 400 && (d <= now || !ok(d)); i++) d.setDate(d.getDate() + 1)
  return d
}
function nextText(sc) {
  const d = nextRun(sc); if (!d) return "per the cron"
  const mins = Math.round((d - new Date()) / 60000), today = d.toDateString() === new Date().toDateString()
  return `${today ? "today" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })} ${d.toTimeString().slice(0, 5)} · in ${mins >= 1440 ? Math.floor(mins / 1440) + "d " : ""}${Math.floor(mins % 1440 / 60)}h ${mins % 60}m`
}
const schedShort = p => !p.schedule ? `<a href="#/processes/${p.id}" onclick="event.stopPropagation();setTimeout(()=>document.getElementById('schedule')?.scrollIntoView({block:'center'}),50)">＋ Schedule</a>` : p.schedule ? `<span title="${esc(cronOf(p.schedule))}">⏰ ${schedText(p.schedule).replace(/^Every /, "")}${p.schedule.paused ? " · paused" : ""}</span>` : "—"
function setSched(id, patch) { const p = proc(id); p.schedule = { ...p.schedule, ...patch }; render() }

    <button onclick="setSched('${id}',{every:'day',at:'00:00',on:'Mon',dom:1,paused:false})">＋ Add a schedule</button></div></div>`

  return `<div class="card" id="schedule"><h3>⏰ Schedule <span class="grow"></span>${sc.paused ? '<span class="pill p-quiet">Paused</span>' : '<span class="pill p-ready">On</span>'}</h3>
    <div class="row" style="flex-wrap:wrap">
      <select style="width:auto" onchange="setSched('${id}',{every:this.value,cron:''})">${EVERY.map(([v, l]) => `<option value="${v}" ${v === sc.every && !sc.cron ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${sc.every === "week" ? `<span>on</span><select style="width:auto" onchange="setSched('${id}',{on:this.value})">${DAYS.map(d => `<option ${d === sc.on ? "selected" : ""}>${d}</option>`).join("")}</select>` : ""}
      ${sc.every === "month" ? `<span>on day</span><input type="number" min="1" max="28" style="width:70px" value="${sc.dom}" onchange="setSched('${id}',{dom:+this.value})">` : ""}
      <span>at</span><input type="time" style="width:auto" value="${sc.at}" onchange="setSched('${id}',{at:this.value})"></div>
    <div class="kv" style="margin-top:14px"><span class="k">Runs</span><span>${schedText(sc)}</span>
      <span class="k">Next Run</span><span>${sc.paused ? '<span class="muted">paused</span>' : !p.ready ? '<span style="color:var(--bad)">won\'t start until the check above passes</span>' : missing.length ? '<span style="color:var(--bad)">won\'t start: it needs input</span>' : nextText(sc)}</span>

function stop(rid, tid) { Object.assign(run(rid).tasks.find(x => x.id === tid), { st: "stopped", subs: 0, waited: 0, summary: "You stopped it.", needs: "Stopped by you just now." }); render() }

let bpmn = null, selected = null

      const label = t.st === "running" ? `<i></i><span class="num" data-el="${key(r, t)}">${fmtEl(t.el)}</span> · <span class="num" data-tok="${key(r, t)}">${fmtTok(t.tok)}</span>${t.subs ? ` · ⑂ ${t.subs}` : ""}` : t.st === "done" ? "✓" : WAITING.includes(t.st) ? `[${tagOf(t)}]` : stText(t)
      overlays.add(t.id, { position: { top: -12, right: t.st === "done" ? 16 : 70 }, html: `<span class="ov ${t.st === "done" ? "done" : stCls(t) === "stuck" ? "waiting" : stCls(t)}">${label}</span>` })
      if (t.round) overlays.add(t.id, { position: { bottom: 14, left: 6 }, html: `<span class="ov quiet">round ${t.round}</span>` })

  }
  if (kind === "modeler") {
    bpmn.get("eventBus").on("selection.changed", e => { selected = e.newSelection[0] || null; renderProps(pid) })
    bpmn.get("eventBus").on("shape.added", e => { const k = PROPS[pid][e.element.id]?.kind; if (k) setTimeout(() => canvas.addMarker(e.element.id, "ants-" + k)) })
    bpmn.get("eventBus").on("commandStack.changed", () => renderChecks(pid))
    renderProps(pid)
  }
}

      "create.end-event": entry("event", "bpmn-icon-end-event-none", "End: the Run finishes here", shape({ type: "bpmn:EndEvent" })),

// Upstream Tasks of an element, walking incoming flows: their Result fields are what it can read.
function upstream(el, seen = new Set()) {
  (el.incoming || []).forEach(f => { const s = f.source; if (!seen.has(s.id)) { seen.add(s.id); upstream(s, seen) } })
  return seen
}
const fieldsOf = (id, p) => p.kind === "agent" ? skillOf(p.skill)?.fields || [] : p.kind === "user" ? (p.what === "Approve" ? ["approved", "comment"] : ["answers"])
  : p.what === "Clone repos" ? ["repos"] : p.what === "Accept recommendations" ? ["answers"] : []
function offered(pid, el) {
  const P = PROPS[pid], reg = bpmn.get("elementRegistry"), out = []
  ;(P.start?.fields || []).forEach(f => f.name && out.push(["${" + f.name + "}", "start form"]))
  upstream(el).forEach(id => { const p = P[id]; if (p && p.kind !== "start") fieldsOf(id, p).forEach(f => out.push([`\${${id}.${f}}`, reg.get(id)?.businessObject.name || id])) })

// Conditions on the paths out of an exclusive gateway. Ants writes them as JUEL on the flow; the user never has to.
const CONDS = {}
;["spec-you", "spec-agent", "spec-rec"].forEach(p => CONDS[p] = { f5: { field: "${grill.questions}", op: "is not empty" }, f7: { def: true }, f10: { field: "${approve.approved}", op: "is true" }, f12: { def: true } })
Object.entries(PATTERNS).forEach(([id, p]) => CONDS[id] = p[5])

const OPS = ["is true", "is false", "is empty", "is not empty", "equals", "does not equal", "is more than", "is less than"]
const needsValue = op => ["equals", "does not equal", "is more than", "is less than"].includes(op)

  return { "is true": `\${${f}}`, "is false": `\${!${f}}`, "is empty": `\${empty ${f}}`, "is not empty": `\${not empty ${f}}`,
    "equals": `\${${f} == ${v}}`, "does not equal": `\${${f} != ${v}}`, "is more than": `\${${f} > ${v}}`, "is less than": `\${${f} < ${v}}` }[c.op]
}

}

  const pid = curPid(), old = selected.businessObject.name, el = bpmn.get("bpmnReplace").replaceElement(selected, { type })
  if (kind) { seedKind(el.id, kind); bpmn.get("canvas").addMarker(el.id, "ants-" + kind); if (!old) bpmn.get("modeling").updateLabel(el, KIND_INFO[kind][0]) }
  bpmn.get("selection").select(el); renderProps(pid)
}
const kindButtons = () => Object.entries(KIND_INFO).map(([k, [n, d, type, cls]]) => `<button style="display:flex;gap:10px;width:100%;text-align:left;margin:6px 0;font-weight:500" onclick="replaceAs('${type}','${k}')">
  <span class="${cls}" style="font-size:22px"></span><span><b>${n}</b><br><span class="muted small">${d}</span></span></button>`).join("")

function renderProps(pid) {
  const box = document.getElementById("props"); if (!box) return
  const P = PROPS[pid] ||= {}, p = proc(pid) || { name: "New Process", vault: "Work", sourceMap: "Stacc repos" }
  const head = (k, ph = "") => `<div class="kind">${k}</div><input style="font-weight:700;font-size:15px" placeholder="${ph}" value="${esc(selected.businessObject.name || "")}" onchange="bpmn.get('modeling').updateLabel(selected,this.value)">`
  const t = selected?.type, bo = selected?.businessObject, ev = bo?.eventDefinitions?.[0]?.$type, e = selected ? P[selected.id] || {} : {}
  let html
  if (!selected || t === "bpmn:Process") {
    html = `<div class="kind">Process</div><h3>${esc(p.name)}</h3>
      ${explain(`<b>Drawing a Process</b><ol style="margin:6px 0 0;padding-left:18px">
        <li>A Run begins at the <b>start event</b> (its start form) and finishes at an <b>end event</b>.</li>
        <li>Add work from the bottom of the palette, or hover a shape and pick the next step from its menu: <b>Agent</b>, <b>User</b> or <b>Built-in Task</b>.</li>
        <li>Choose between paths with a <b>decision</b> (◇ ×). Loop by drawing a path back to an earlier Task.</li>
        <li>Run branches side by side with two <b>parallel gateways</b> (◇ +): one splits, one joins.</li>
        <li>Fix everything under <b>Checks</b>, then <b>Save and deploy</b>.</li></ol>`)}
      ${field("Vault", "Which Vault this Process's Tasks are told about.", "", `<select onchange="(proc('${pid}')||{}).vault=this.value">${[...S.vaults.map(v => v.name), "—"].map(v => `<option ${v === p.vault ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`)}
      ${field("Source map", "Where repo names in this Process resolve.", "", `<select>${S.sourceMaps.map(v => `<option ${v.name === p.sourceMap ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>`)}`
  } else if (t === "bpmn:StartEvent" && ev === "bpmn:TimerEventDefinition") {
    html = head("Timer start", "e.g. Every Monday 06:00") + explain(`Starts a Run on a schedule, with no one pressing Start. ${proc(pid) ? `Easier: set it in words under <b>Schedule</b> on <a href="#/processes/${pid}">the Process page</a>.` : "Set it in words on the Process page once it's saved."}`)
      + field("When", "A cron expression: minute, hour, day of month, month, day of week.", "0 6 * * MON  (Mondays at 06:00)", `<input class="mono" value="0 6 * * MON">`)
      + startForm(pid)
  } else if (t === "bpmn:StartEvent") {
    html = head("Start event", "e.g. Prompt") + explain("Where a Run begins. Its fields are the start form the user fills in on the Process page, and every Task can read them as <code>${field}</code>.") + startForm(pid)
  } else if (t === "bpmn:EndEvent") {
    html = head("End event", "e.g. Done") + explain("The Run finishes here. Ants writes the Report and deletes the Run workspace. Several end events are fine, named for how the Run ended.")
  } else if (t === "bpmn:IntermediateCatchEvent" && ev === "bpmn:TimerEventDefinition") {
    html = head("Wait", "e.g. Wait 1 hour") + explain("The flow pauses here. No Agent runs and no slot is held.")
      + field("Wait for", "An ISO 8601 duration: <code>PT30M</code> 30 minutes, <code>PT1H</code> an hour, <code>P1D</code> a day.", "PT1H", `<input class="mono" value="PT1H">`)
  } else if (t === "bpmn:Task" || t === "bpmn:ManualTask" || ((t === "bpmn:ServiceTask" || t === "bpmn:UserTask") && !e.kind)) {
    html = head(t === "bpmn:Task" ? "Plain Task" : t.replace("bpmn:", ""), "e.g. Write the spec") + `<div class="warn">${t === "bpmn:Task" || t === "bpmn:ManualTask" ? "Ants would pass straight through this, doing nothing." : "Ants doesn't know who does this yet."} What should it be?</div>` + kindButtons()
  } else if (e.kind === "agent") {
    const ag = agentOf(e.agent), sk = ag ? ag.skills : [], ins = offered(pid, selected), id = selected.id
    html = head("Agent Task", "e.g. Write the spec") + `
      ${field("Agent", "Who does it.", "", `<select onchange="PROPS['${pid}']['${id}'].agent=this.value;PROPS['${pid}']['${id}'].skill=(agentOf(this.value)?.skills||[])[0]||'';renderProps('${pid}')"><option value="">Choose…</option>${S.agents.map(a => `<option ${a.name === e.agent ? "selected" : ""} value="${a.name}">${a.name} · ${esc(a.desc)}</option>`).join("")}</select>`)}
      <button class="ghost small" onclick="openCreate('agents','${pid}','${id}')">＋ New Agent</button>
      ${e.agent && !ag ? `<div class="warn">No Agent folder holds "${esc(e.agent)}".</div>` : ""}
      ${field("Skill", "One of the Agent's Skills: the one job this Task does.", "", `<select ${ag ? "" : "disabled"} onchange="PROPS['${pid}']['${id}'].skill=this.value;renderProps('${pid}')">${sk.map(s => `<option ${s === e.skill ? "selected" : ""}>${s}</option>`).join("")}</select>`)}
      <button class="ghost small" onclick="openCreate('skills','${pid}','${id}')">＋ New Skill</button>
      ${skillOf(e.skill) ? `<div class="help">${esc(skillOf(e.skill).desc)}<br>Later Tasks can read: ${skillOf(e.skill).fields.map(f => `<code>\${${id}.${f}}</code>`).join(" ") || "nothing"}</div>` : ""}
      ${field("Inputs", "What it reads: start-form fields and Results of Tasks <b>before</b> it in the diagram.", "${scout.brief}",
        `<div class="listed">${e.inputs.map((v, i) => `<div class="row"><select class="mono grow" onchange="PROPS['${pid}']['${id}'].inputs[${i}]=this.value;renderProps('${pid}')"><option value="">Choose…</option>
          ${[...ins, ...(v && !ins.some(([x]) => x === v) ? [[v, "not available here"]] : [])].map(([x, from]) => `<option value="${x}" ${x === v ? "selected" : ""}>${x}  (${esc(from)})</option>`).join("")}</select>
          <button class="ghost" onclick="PROPS['${pid}']['${id}'].inputs.splice(${i},1);renderProps('${pid}')">×</button></div>
          ${!v || ins.some(([x]) => x === v) ? "" : `<div class="warn">${esc(v)} isn't returned by any Task before this one.</div>`}`).join("")}
          <button onclick="PROPS['${pid}']['${id}'].inputs.push('');renderProps('${pid}')">＋ Add input</button></div>`)}
      ${field("When the flow comes back", "", "", `<label class="row" style="font-weight:500"><input type="checkbox" checked> Resume the session (Round answers, Send back)</label>`)}
      ${field("Knowledge", "", "", `<label class="row" style="font-weight:500"><input type="checkbox" ${skillOf(e.skill)?.vault ? "checked" : ""}> Vault</label><label class="row" style="font-weight:500"><input type="checkbox"> Answer History</label>`)}`
  } else if (e.kind === "user") {
    html = head("User Task", "e.g. Approve the spec") + explain("The Run waits here, on the Notification list, until you act. Other branches keep going.")
      + field("What you do", "", "", `<select onchange="PROPS['${pid}']['${selected.id}'].what=this.value;renderProps('${pid}')"><option ${e.what === "Answer a Round" ? "selected" : ""}>Answer a Round</option><option ${e.what === "Approve" ? "selected" : ""}>Approve</option></select>`)
      + field("Shows the Result of", "The earlier Task whose Result the page shows, and which Send back resumes.", "", `<select>${Object.entries(P).filter(([, x]) => x.kind === "agent").map(([id]) => `<option ${id === e.shows ? "selected" : ""}>${id}</option>`).join("")}</select>`)
      + `<div class="help" style="margin-top:8px">Later Tasks and decisions can read: ${fieldsOf(selected.id, e).map(f => `<code>\${${selected.id}.${f}}</code>`).join(" ")}</div>`
  } else if (e.kind === "builtin") {
    html = head("Built-in Task", "e.g. Clone repos") + explain("Ants does this itself. No Agent, no tokens, no slot.")
      + field("What Ants does", "", "", `<select onchange="PROPS['${pid}']['${selected.id}'].what=this.value;renderProps('${pid}')">${["Clone repos", "Push", "Accept recommendations", "Choose repos"].map(w => `<option ${w === e.what ? "selected" : ""}>${w}</option>`).join("")}</select>`)
  } else if (t === "bpmn:ExclusiveGateway") {
    const out = selected.outgoing, merge = out.length <= 1 && selected.incoming.length > 1
    html = head("Decision (exclusive gateway)", "Ask it as a question, e.g. Approved?")
      + (merge ? explain("This decision only <b>merges</b> paths back into one, such as a loop's way back in. It needs no conditions.")
        : explain(`A fork in the road: the Run takes <b>exactly one</b> path out. Give each path a condition on a Result from an earlier Task, and make one the <b>default</b>, taken when nothing else matches.
          <div class="small" style="margin-top:6px">Example from the shipped Processes: <b>Approved?</b> takes <i>yes</i> when <code>approve.approved</code> is true; <i>send back</i> is the default and loops to Write the spec.</div>`))
      + (out.length ? `<b class="small">Paths out (${out.length})</b>` + out.map(f => pathEditor(pid, selected, f)).join("") : `<div class="warn">No paths out yet. Hover the decision and drag its arrow to the next step.</div>`)
  } else if (t === "bpmn:ParallelGateway") {
    const split = selected.outgoing.length > 1, join = selected.incoming.length > 1
    html = head("Parallel gateway") + explain(split && !join ? `<b>Splits</b> the flow: all ${selected.outgoing.length} branches start at once. Agent Tasks in them share the ${S.cap} slots.`
      : join && !split ? `<b>Joins</b> the branches: waits here until all ${selected.incoming.length} have arrived, then carries on.`
      : "Use two of these: one to <b>split</b> into branches that run at the same time, one to <b>join</b> them, waiting until all are done.")
      + (split ? `<b class="small">Branches</b>${selected.outgoing.map(f => `<div class="small" style="padding:4px 0">→ ${esc(nameOf(f.target))}</div>`).join("")}` : "")
  } else if (t === "bpmn:SequenceFlow") {
    const src = selected.source
    html = head("Path", "e.g. yes") + (src.type === "bpmn:ExclusiveGateway" && src.outgoing.length > 1 ? pathEditor(pid, src, selected) + `<button class="ghost" onclick="bpmn.get('selection').select(bpmn.get('elementRegistry').get('${src.id}'))">See every path out of ${esc(nameOf(src))}</button>`
      : explain(`Paths out of ${src.type.includes("Gateway") ? "a parallel gateway" : "a Task or event"} need no condition: when it's done, the flow moves on.`))
  } else if (t === "bpmn:CallActivity") {
    html = head("Call a Process", "e.g. Prompt to spec") + explain("Runs another Process as one step and waits for it to finish. How inputs and the result travel is open in <a href='https://github.com/oyvij/ants/issues/21' target='_blank'>Which BPMN elements does Ants run?</a>")
      + field("Process", "", "", `<select>${S.processes.map(x => `<option>${esc(x.name)}</option>`).join("")}</select>`)
  } else if (t === "bpmn:SubProcess") {
    html = head("Sub-process", "e.g. Grill until clear") + explain("Groups part of the flow into one box, such as a question loop. Collapse it from the wrench menu to tidy the diagram.")
  } else if (["bpmn:TextAnnotation", "bpmn:Group"].includes(t)) {
    html = `<div class="kind">${t.replace("bpmn:", "")}</div>` + explain("A note for people reading the diagram. Ants ignores it when running.")
  } else {
    html = `<div class="kind">${esc(t.replace("bpmn:", ""))}${ev ? " · " + esc(ev.replace("bpmn:", "")) : ""}</div><h3>${esc(nameOf(selected))}</h3><div class="warn">Ants doesn't run this element, so Save and deploy will refuse it. See <a href="https://github.com/oyvij/ants/issues/21" target="_blank">Which BPMN elements does Ants run?</a></div>`
      + (/Task$/.test(t) ? `<div class="small" style="margin-top:10px">Change it to:</div>` + kindButtons() : /Gateway$/.test(t) ? `<div class="small" style="margin-top:10px">Change it to:</div><button onclick="replaceAs('bpmn:ExclusiveGateway')">Decision</button> <button onclick="replaceAs('bpmn:ParallelGateway')">Parallel gateway</button>` : "")
  }
  box.innerHTML = html
  renderChecks(pid)
}
function startForm(pid) {
  const F = (PROPS[pid].start ||= { kind: "start", fields: [] }).fields, set = (i, prop, v) => `setField('${pid}',${i},'${prop}',${v})`
  return field("Start form", "What the user fills in to start a Run. Tasks read each field by its name, as <code>${name}</code>.", "", `<div class="listed">${F.map((x, i) => `
    <div class="card" style="padding:10px;margin:6px 0;box-shadow:none">
      <div class="row"><input placeholder="Label, e.g. Work branch" value="${esc(x.label)}" onchange="setLabel('${pid}',${i},this.value)"><button class="ghost" title="Remove" onclick="PROPS['${pid}'].start.fields.splice(${i},1);renderProps('${pid}')">×</button></div>
      <div class="row" style="margin-top:6px"><select onchange="${set(i, "type", "this.value")}">${FIELD_TYPES.map(([v, l]) => `<option value="${v}" ${v === x.type ? "selected" : ""}>${l}</option>`).join("")}</select>
        <label class="row small" style="white-space:nowrap;font-weight:500"><input type="checkbox" ${x.required ? "checked" : ""} onchange="${set(i, "required", "this.checked")}"> Required</label></div>
      <input class="small" style="margin-top:6px" placeholder="Help shown under the field" value="${esc(x.help || "")}" onchange="${set(i, "help", "this.value")}">
      ${x.editName ? `<div class="row" style="margin-top:6px"><span class="small muted" style="white-space:nowrap">Tasks read it as</span><input class="mono" value="${esc(x.name)}" onchange="PROPS['${pid}'].start.fields[${i}].editName=false;${set(i, "name", "this.value")}"></div>`
        : x.name ? `<div class="help" style="margin:6px 0 0">Tasks read it as <code>\${${esc(x.name)}}</code> · <a href="javascript:void 0" onclick="PROPS['${pid}'].start.fields[${i}].editName=true;renderProps('${pid}')">change</a></div>` : ""}</div>`).join("")}
    <button onclick="PROPS['${pid}'].start.fields.push({name:'',label:'',type:'text',required:false,help:''});renderProps('${pid}')">＋ Add field</button></div>`)
}
// "Work branch" -> workBranch. Only while the name is still derived: renaming later would break Tasks that read it.
const camel = l => l.trim().toLowerCase().replace(/[^a-z0-9]+(.)/g, (m, c) => c.toUpperCase()).replace(/[^a-zA-Z0-9]/g, "").replace(/^[^a-z]+/, "")
function setLabel(pid, i, v) { const x = PROPS[pid].start.fields[i]; x.label = v; if (!x.name || x.auto) { x.name = camel(v); x.auto = true }; renderProps(pid) }
function setField(pid, i, prop, v) { if (prop === "name") PROPS[pid].start.fields[i].auto = false; PROPS[pid].start.fields[i][prop] = v; renderProps(pid) }

// Live checks: everything Save and deploy would refuse, shown while drawing. Click one to jump to it.
const UNSUPPORTED = { "bpmn:ScriptTask": "Ants doesn't run inline scripts; use a Built-in Task.", "bpmn:BusinessRuleTask": "DMN isn't decided yet.",
  "bpmn:SendTask": "Ants doesn't send messages.", "bpmn:ReceiveTask": "Ants doesn't receive messages.", "bpmn:InclusiveGateway": "use a decision or a parallel gateway.",
  "bpmn:ComplexGateway": "use a decision or a parallel gateway.", "bpmn:EventBasedGateway": "use a decision.", "bpmn:DataObjectReference": "data objects aren't run; use an annotation.",
  "bpmn:DataStoreReference": "data stores aren't run; use an annotation.", "bpmn:Participant": "pools aren't run; one Process per diagram.", "bpmn:IntermediateThrowEvent": "Ants doesn't throw events." }
function checks(pid) {
  const P = PROPS[pid] ||= {}, C = CONDS[pid] ||= {}, out = []
  const els = bpmn.get("elementRegistry").getAll().filter(e => e.type !== "label" && !e.waypoints && !["bpmn:Process", "bpmn:TextAnnotation", "bpmn:Group", "bpmn:Association"].includes(e.type) && e.parent)
  if (!els.some(e => e.type === "bpmn:StartEvent")) out.push({ msg: "Add a start event: it is where a Run begins." })
  const startId = els.find(e => e.type === "bpmn:StartEvent")?.id, names = (P.start?.fields || []).map(f => f.name)
  names.forEach((n, i) => {
    if (!/^[a-z][A-Za-z0-9]*$/.test(n)) out.push({ id: startId, msg: `<b>Start form</b>: "${esc(n) || "(no name)"}" can't be read as \${…}. Use letters and digits, starting with a lowercase letter.` })
    else if (names.indexOf(n) !== i) out.push({ id: startId, msg: `<b>Start form</b>: two fields are called "${esc(n)}".` })
  })
  if (!els.some(e => e.type === "bpmn:EndEvent")) out.push({ msg: "Add an end event so a Run can finish." })
  els.forEach(e => {
    const n = nameOf(e), ev = e.businessObject.eventDefinitions?.[0]?.$type, p = P[e.id], add = msg => out.push({ id: e.id, msg: `<b>${esc(n)}</b>: ${msg}` })
    if (UNSUPPORTED[e.type]) return add(UNSUPPORTED[e.type])
    if (ev && ev !== "bpmn:TimerEventDefinition") return add(`Ants doesn't run ${ev.replace("bpmn:", "").replace("EventDefinition", "").toLowerCase()} events.`)
    if (e.type === "bpmn:Task" || e.type === "bpmn:ManualTask") return add("does nothing as it stands. Choose Agent, User or Built-in Task.")
    if (/ServiceTask|UserTask/.test(e.type) && !p) return add("choose whether it is an Agent, User or Built-in Task.")
    if (e.type !== "bpmn:StartEvent" && !e.incoming.length) add("nothing leads here.")
    if (e.type !== "bpmn:EndEvent" && !e.outgoing.length) add("leads nowhere. Connect it to the next step or an end event.")
    if (p?.kind === "agent") {
      if (!agentOf(p.agent)) add(p.agent ? `no Agent folder holds "${esc(p.agent)}".` : "choose an Agent.")
      else if (!agentOf(p.agent).skills.includes(p.skill)) add(`${esc(p.agent)} doesn't run the Skill "${esc(p.skill)}".`)
      const ins = offered(pid, e).map(([x]) => x); p.inputs.filter(v => v && !ins.includes(v)).forEach(v => add(`${esc(v)} isn't returned by any Task before it.`))
    }
    if (e.type === "bpmn:ExclusiveGateway" && e.outgoing.length > 1) {
      if (!e.outgoing.some(f => C[f.id]?.def)) add("no default path. If no condition matches, the Run stops here.")
      const bare = e.outgoing.filter(f => !C[f.id]?.def && !C[f.id]?.field).length
      if (bare) add(`${bare} path${bare > 1 ? "s" : ""} without a condition.`)
    }
  })
  return out
}
function renderChecks(pid) {
  const box = document.getElementById("checks"); if (!box || !bpmn) return
  const cs = checks(pid)
  box.innerHTML = `<div class="row" style="margin-bottom:6px"><b>Checks</b><span class="grow"></span>${cs.length ? `<span class="pill p-waiting">${cs.length} to fix</span>` : `<span class="pill p-ready">Ready to deploy</span>`}</div>`
    + cs.map(c => `<div class="small" style="padding:5px 8px;border-radius:6px;cursor:${c.id ? "pointer" : "default"}" onmouseover="this.style.background='var(--line2)'" onmouseout="this.style.background=''"
      ${c.id ? `onclick="const el=bpmn.get('elementRegistry').get('${c.id}');bpmn.get('canvas').scrollToElement(el);bpmn.get('selection').select(el)"` : ""}>⚠ ${c.msg}</div>`).join("")
}
function saveDeploy() {
  const pid = curPid(), cs = checks(pid)
  const t = document.createElement("div"); t.className = "toast"
  t.innerHTML = (cs.length ? `<b>Can't deploy: ${cs.length} to fix</b><div class="small" style="margin-top:4px">They're listed under Checks; click one to jump to it.</div>`
    : "<b>Deployed.</b> Renamed <code>camunda:</code> to <code>operaton:</code> and deployed to Operaton. New Runs use this version.") + `<div style="text-align:right;margin-top:8px"><button onclick="this.closest('.toast').remove()">OK</button></div>`
  document.body.append(t)
}

// ---------- router ----------
function render() {
  const p = route().split("/").filter(Boolean)
  if (!S.loggedIn || p[0] === "login") { renderSide(); document.getElementById("app").innerHTML = pLogin(); return dump() }
  let body, full = false
  if (!p.length) body = home()
  else if (p[0] === "notifications") body = pNotifications()
  else if (p[0] === "runs" && p[2] === "tasks") body = pTask(p[1], p[3])
  else if (p[0] === "runs" && p[1]) body = pRun(p[1])
  else if (p[0] === "runs") body = pRuns()
  else if (p[0] === "processes" && p[2] === "edit") { body = pModeler(p[1]); full = true }
  else if (p[0] === "processes" && p[1] === "new") body = pNewProcess()
  else if (p[0] === "processes" && p[1]) body = pProcess(p[1])
  else if (p[0] === "processes") body = pProcesses()
  else if (p[0] === "agents" && p[1]) body = pAgent(p[1] === "new" ? "" : p[1])
  else if (p[0] === "skills" && p[1]) body = pSkill(p[1] === "new" ? "" : p[1])
  else if (p[0] === "agents" || p[0] === "skills") body = pList(p[0])
  else if (p[0] === "settings") body = pSettings()
  else body = ph("Not found")
  if (p[0] !== "agents") S.draft = null
  document.getElementById("app").innerHTML = `<main class="${full ? "full" : ""}">${body}</main>`
  renderSide()
  selected = null; mountDiagrams(); window.mountEditors?.(); dump()
}
function dump() {
  document.getElementById("state").textContent = JSON.stringify({ route: route(), notifications: notes().length, agentTasksRunning: `${running()} of ${S.cap}`, paused: S.paused, update: S.update,
    runs: Object.fromEntries(S.runs.map(r => [r.id, r.state === "live" ? r.tasks.map(t => `${t.id}:${t.st}`).join(" ") : r.state])) }, null, 2)
}
addEventListener("hashchange", () => { scrollTo(0, 0); closeDrawer(); closeCreate(); render() })
render()
</script>

<script type="module">
// Markdown and JSON editors (CodeMirror 6) over every textarea[data-md] / textarea[data-json], and markdown views.
import { EditorView, keymap, drawSelection, placeholder } from "https://esm.sh/@codemirror/view@6"
import { EditorState } from "https://esm.sh/@codemirror/state@6"
import { defaultKeymap, history, historyKeymap } from "https://esm.sh/@codemirror/commands@6"

const mdStyle = HighlightStyle.define([
  { tag: tags.heading1, fontSize: "1.45em", fontWeight: "700" }, { tag: tags.heading2, fontSize: "1.25em", fontWeight: "700" },
  { tag: tags.heading3, fontSize: "1.1em", fontWeight: "700" }, { tag: tags.strong, fontWeight: "700" }, { tag: tags.emphasis, fontStyle: "italic" },
  { tag: tags.strikethrough, textDecoration: "line-through" }, { tag: tags.link, color: "#4f46e5", textDecoration: "underline" },
  { tag: tags.monospace, fontFamily: "ui-monospace, monospace", fontSize: ".92em", backgroundColor: "#f0f2f5" },
  { tag: [tags.processingInstruction, tags.meta], color: "#94a3b8" }, { tag: tags.quote, color: "#64748b", fontStyle: "italic" }, { tag: tags.list, color: "#4f46e5" },
])
const base = [history(), drawSelection(), EditorView.lineWrapping, keymap.of([...defaultKeymap, ...historyKeymap])]

const colourDiff = root => root.querySelectorAll("code.language-diff").forEach(c => {
  c.innerHTML = c.textContent.split("\n").map(l => `<span class="${l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : l.startsWith("@@") ? "hunk" : ""}">${l.replace(/[&<>]/g, x => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[x])}</span>`).join("\n")
})
const renderMd = (el, src) => { el.innerHTML = marked.parse(src); colourDiff(el) }

function wrap(view, ta, mdMode) {
  const ed = document.createElement("div"); ed.className = "ed" + (mdMode ? "" : " json")
  const bar = document.createElement("div"); bar.className = "bar"
  const surround = (a, b = a) => { const { from, to } = view.state.selection.main
    view.dispatch({ changes: { from, to, insert: a + view.state.sliceDoc(from, to) + b }, selection: { anchor: from + a.length, head: to + a.length } }); view.focus() }
  const linePrefix = p => { const line = view.state.doc.lineAt(view.state.selection.main.from); view.dispatch({ changes: { from: line.from, insert: p } }); view.focus() }
  const btn = (label, title, fn) => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = label; b.title = title; b.onclick = fn; bar.append(b); return b }
  if (mdMode) {
    btn("<b>B</b>", "Bold (⌘B)", () => surround("**")); btn("<i>I</i>", "Italic (⌘I)", () => surround("*")); btn("H", "Heading", () => linePrefix("## "))
    btn("•", "List", () => linePrefix("- ")); btn("1.", "Numbered list", () => linePrefix("1. ")); btn("&lt;/&gt;", "Code", () => surround("`")); btn("🔗", "Link", () => surround("[", "](url)"))
    bar.append(Object.assign(document.createElement("span"), { className: "sp" }))
    btn("Preview", "Preview in a big window", () => modal("Preview", m => { m.className = "mb md"; renderMd(m, view.state.doc.toString()) }))
    btn("⤢ Expand", "Write in a big window with a live preview", () => expand(view, bar, ta))
  } else {
    bar.append(Object.assign(document.createElement("span"), { className: "sp", textContent: "JSON Schema" }))
    const st = Object.assign(document.createElement("span"), { className: "st" }); bar.append(st)
    const check = () => { try { const o = JSON.parse(view.state.doc.toString()); st.innerHTML = o.type === "object" && o.properties ? '<span style="color:#16a34a">✓ valid schema</span>' : '<span style="color:#d97706">needs "type": "object" and "properties"</span>' }
      catch (e) { st.innerHTML = `<span style="color:#dc2626">✗ ${e.message.split(" in JSON")[0]}</span>` } }
    view.dom.addEventListener("keyup", check); check()
  }
  ta.hidden = true; ta.after(ed); ed.append(bar, view.dom); if (ta.hasAttribute("data-tall")) ed.classList.add("tall")
}
// A big window: Esc, the ✕ or a click outside closes it.
function modal(title, fill, onClose) {
  const bg = document.createElement("div"); bg.className = "modal-bg"
  bg.innerHTML = `<div class="modal"><div class="mh"><b>${title}</b><span style="flex:1"></span><span class="muted small">Esc to close</span><button class="ghost" title="Close">✕</button></div><div class="mb"></div></div>`
  const close = () => { bg.remove(); removeEventListener("keydown", esc); onClose?.() }, esc = e => { if (e.key === "Escape") close() }
  bg.querySelector(".mh button").onclick = close; bg.onclick = e => { if (e.target === bg) close() }; addEventListener("keydown", esc)
  document.body.append(bg); fill(bg.querySelector(".mb"), bg)
}
// Expand moves the same editor into the window, next to a live preview, and back on close: nothing to sync.
function expand(view, bar, ta) {
  const label = ta.closest(".card")?.querySelector("h3, label.f")?.textContent || "Edit"
  let h
  modal(label, mb => {
    mb.className = "split"; mb.innerHTML = '<div class="left"></div><div class="md"></div>'
    const pv = mb.querySelector(".md"), update = () => renderMd(pv, view.state.doc.toString())
    mb.querySelector(".left").append(view.dom); update(); view.focus(); h = setInterval(update, 400)
  }, () => { clearInterval(h); bar.after(view.dom); view.focus() })
}

window.mountEditors = () => {
  document.querySelectorAll("textarea[data-md]:not([data-done]), textarea[data-json]:not([data-done])").forEach(ta => {
    ta.dataset.done = 1
    const mdMode = ta.hasAttribute("data-md"), ro = !!ta.closest(".card")?.querySelector("input[disabled]")
    const sync = EditorView.updateListener.of(u => { if (u.docChanged) ta.value = u.state.doc.toString() })
    const fmt = keymap.of(mdMode ? [{ key: "Mod-b", run: v => (wrapSel(v, "**"), true) }, { key: "Mod-i", run: v => (wrapSel(v, "*"), true) }] : [])
    const view = new EditorView({ state: EditorState.create({ doc: ta.value, extensions: [fmt, ...base, sync, placeholder(ta.placeholder || ""), EditorState.readOnly.of(ro),
      ...(mdMode ? [markdown(), syntaxHighlighting(mdStyle)] : [json(), syntaxHighlighting(defaultHighlightStyle), bracketMatching(), linter(jsonParseLinter()), lintGutter()])] }) })
    wrap(view, ta, mdMode)
    if (ro) { const ed = ta.nextElementSibling; ed.style.background = "#fafbfc"; ed.querySelector(".bar").insertAdjacentHTML("beforeend", '<span class="st" style="color:#64748b">Read-only · Copy to edit</span>') }
  })
  document.querySelectorAll("[data-mdview]:not([data-done])").forEach(el => { el.dataset.done = 1; renderMd(el, el.textContent) })
}
function wrapSel(v, m) { const { from, to } = v.state.selection.main; v.dispatch({ changes: { from, to, insert: m + v.state.sliceDoc(from, to) + m }, selection: { anchor: from + m.length, head: to + m.length } }) }
window.mountEditors()
</script>
</html>
