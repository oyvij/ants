version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-major:
        patterns: ["*"]
        update-types: [major]  

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groupds:
      actions:
        patterns: ["*"]
