name: test

on:
  pull_request:
  push:
    branches: [main, "wave-*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # One file per node --check: it checks only the first and passes the rest to it as arguments.
      - run: for script in src/main/resources/static/*.js; do node --check "$script"; done
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
