name: image

# Publishes the multi-arch Ants image to GHCR, tagged with build.gradle.kts' version and latest. The release calls it
# on a version bump; `gh workflow run image.yml` publishes one by hand.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # The jar is the same on every platform, so it is built once, here, and each platform's image copies it.
      - run: ./gradlew bootJar
      - id: version
        run: echo "version=$(grep -o '^version = "[^"]*"' build.gradle.kts | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }},ghcr.io/${{ github.repository }}:latest
