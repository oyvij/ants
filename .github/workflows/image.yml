name: image

# Publishes the multi-arch Ants image of the release v<version> to GHCR, tagged with the version and with latest for a
# stable release or beta for a beta (0.27.0-beta.412). release.yml and ci.yml call it;
# `gh workflow run image.yml -f version=x.y.z` publishes one by hand.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: the release's version, its tag without the v
        type: string
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # The jar is the same on every platform, so it is built once, here, and each platform's image copies it.
      - run: ./gradlew bootJar -Prelease=${{ inputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }},ghcr.io/${{ github.repository }}:${{ contains(inputs.version, '-') && 'beta' || 'latest' }}
