name: ci

# The tests, as three jobs at once (build.gradle.kts' shards). On main, each push then publishes a beta on these same
# tests: a GitHub prerelease holding the macOS arm64 tarball, its SHA256SUMS and install.sh, which only an Ants with
# prereleases on in settings offers, and its image, tagged with the version and beta. release.yml makes the newest beta
# the stable release.
# A push to main skips the tests when a green run already tested the same tree: what a PR merges once it's up to date
# with main (main's protection asks for that), so the beta goes out without running them twice. An admin merge of a
# branch behind main, or one never green, makes a tree no run tested, and the tests run.
# The full suite gates a merge and a release, not each push: a branch's work is checked locally with
# scripts/affected-tests, and an agent that can't run the browser shard locally runs it here by hand:
# gh workflow run ci.yml --ref <branch> -f shards='["browser","look"]'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shards:
        description: the shards to run, as a JSON list
        type: string
        default: '["look","browser","rest"]'

jobs:
  # On a push to main, the id of a green run whose head has this commit's tree and whose every shard passed, else empty.
  tested:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/git/commits/$1" --jq .tree.sha; }
          want=$(tree "$GITHUB_SHA")
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --status success --limit 40 --json databaseId,headSha \
            --jq '.[] | "\(.databaseId) \(.headSha)"' | while read -r run sha; do
            [ "$sha" != "$GITHUB_SHA" ] && [ "$(tree "$sha")" = "$want" ] || continue
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "success") | .name | select(test("^test / test \\((look|browser|rest)\\)$"))] | unique | length')
            if [ "$passed" = 3 ]; then
              echo "Run $run tested this tree at $sha: the tests are skipped."
              echo "run=$run" >> "$GITHUB_OUTPUT"
              break
            fi
          done

  test:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.run == '' }}
    uses: ./.github/workflows/test.yml
    with:
      shards: ${{ inputs.shards || '["look","browser","rest"]' }}

  # The next minor version after the latest stable release, with the run number: 0.27.0-beta.412.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          IFS=. read -r major minor _ <<< "${stable#v}"
          echo "version=$major.$((minor + 1)).0-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  prerelease:
    needs: [version, tested, test]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.tested.outputs.run != '')) }}
    # Apple silicon: the tarball's Java runtime is the build machine's.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew tarball -Prelease=$VERSION
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" build/dist/* install.sh --target "$GITHUB_SHA" --title "Ants $VERSION" --generate-notes --prerelease

  image:
    needs: [version, prerelease]
    if: ${{ !cancelled() && needs.prerelease.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}
