name: ci

# The tests, as three jobs at once (build.gradle.kts' shards). On main, a version that is a major or minor bump (x.y.0)
# with no release yet then releases, on these same tests: a GitHub release holding the macOS arm64 tarball, its
# SHA256SUMS and install.sh, then the image (image.yml, called here, since a release made with GITHUB_TOKEN starts no
# other workflow). A patch version releases nothing.
# The full suite gates a merge and a release, not each push: a branch's work is checked locally with
# scripts/affected-tests, and an agent that can't run the browser shard locally runs it here by hand:
# gh workflow run ci.yml --ref <branch> -f shards='["browser","look"]'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shards:
        description: the shards to run, as a JSON list
        type: string
        default: '["look","browser","rest"]'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      shards: ${{ inputs.shards || '["look","browser","rest"]' }}

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -o '^version = "[^"]*"' build.gradle.kts | cut -d '"' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $version == *.*.0 ]] && ! gh release view "v$version" > /dev/null 2>&1; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [version, test]
    if: needs.version.outputs.bump == 'true'
    # Apple silicon: the tarball's Java runtime is the build machine's.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew tarball
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" build/dist/* install.sh --target "$GITHUB_SHA" --title "Ants $VERSION" --generate-notes

  image:
    needs: [version, release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}
