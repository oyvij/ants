name: soak

# Five test runs at once, each under CPU load and in its own random class order, to find timing flakes before
# parallel agents trip on them. Run it with `gh workflow run soak.yml`.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        run: ["1", "2", "3", "4", "5"]
    uses: ./.github/workflows/test.yml
    with:
      load: true
      run: ${{ matrix.run }}
